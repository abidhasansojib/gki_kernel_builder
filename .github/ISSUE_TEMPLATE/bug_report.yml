name: "🐛 Bug Report"
description: "Report a bug or issue with the kernel build"
title: "[Bug]: "
labels: ["Bug"]

body:
  - type: input
    id: device_name
    attributes:
      label: Device Name
      description: The name and model of your device
      placeholder: "e.g., Redmi Note 14 4G (tanzanite)"
    validations:
      required: true

  - type: input
    id: os_android_version
    attributes:
      label: OS + Android Version
      description: Your ROM name, OS version, and Android version
      placeholder: "e.g., Xiaomi HyperOS 3.0.302 (Android 16)"
    validations:
      required: true

  - type: input
    id: stock_kernel_version
    attributes:
      label: Stock Kernel Version
      description: Original stock kernel version before flashing
      placeholder: "e.g., 6.12.30-android16-5-g6e872b4863d6"
    validations:
      required: true

  - type: input
    id: flashed_version
    attributes:
      label: Flashed Kernel Version / Release
      description: Which release tag or file version did you flash?
      placeholder: "e.g., Release 1 (r1) / 6.12.30-android16-2025-07-AnyKernel3.zip"
    validations:
      required: true

  - type: checkboxes
    id: bypass_flash_mode
    attributes:
      label: Bypass Flash Mode
      description: Did you test flashing with Bypass Image (Volume Up / [VOL+] during installation)?
      options:
        - label: "Yes, I flashed / tested with Bypass Flash Mode ([VOL+] pressed)"
          required: true
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: Clear and concise description of what the issue is.
      placeholder: "Explain what happened and what was expected..."
    validations:
      required: true

  - type: textarea
    id: how_to_reproduce
    attributes:
      label: How to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: screenshots_logs
    attributes:
      label: Screenshots & Logs
      description: Attach screenshots, screen recordings, or paste logs (dmesg / logcat output) if applicable.
      placeholder: "Drag and drop images or paste log output here..."
    validations:
      required: false
