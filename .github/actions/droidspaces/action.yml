name: Setup Droidspaces-OSS
description: Clone and apply Droidspaces-OSS patches for android16-6.12
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  android_version:
    description: 'Android version (e.g., android16)'
    required: false
    default: 'android16'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  os_patch_level:
    description: 'OS patch level (e.g., 2025-07)'
    required: false
    default: '2025-07'
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Download and Apply Droidspaces-OSS Patches
      uses: ./.github/actions/retry
      with:
        command: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}

    - name: Apply the SYSVIPC kABI fix
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ -f "${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch" ]; then
          cp "${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch" ./
          patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch || echo "Patch already applied or skipped"
        fi

    - name: Export IPC symbols for module linkage
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        NS_FILE="${{ github.workspace }}/kernel/common/ipc/namespace.c"
        MSG_FILE="${{ github.workspace }}/kernel/common/ipc/msgutil.c"
        if [ -f "$NS_FILE" ] && ! grep -q "EXPORT_SYMBOL_GPL(put_ipc_ns);" "$NS_FILE"; then
          echo >> "$NS_FILE"
          echo 'EXPORT_SYMBOL_GPL(put_ipc_ns);' >> "$NS_FILE"
        fi
        if [ -f "$MSG_FILE" ] && ! grep -q "EXPORT_SYMBOL_GPL(init_ipc_ns);" "$MSG_FILE"; then
          echo >> "$MSG_FILE"
          echo 'EXPORT_SYMBOL_GPL(init_ipc_ns);' >> "$MSG_FILE"
        fi

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # IPC
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Namespaces
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y

          # HW access
          CONFIG_DEVTMPFS=y

          # binfmt: running distro binaries out of the container
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y

          # xattr / posix acl on tmpfs (NixOS)
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Networking: enhanced NAT & container networking
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y

          # UFW - reject target & logging
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_IP6_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y

          # fail2ban
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
