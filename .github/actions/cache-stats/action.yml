name: 'Show Cache Stats'
description: 'Displays statistics for Bazel cache'
inputs:
  clear_stats:
    description: 'Whether to clear stats after displaying (default: true)'
    required: false
    type: boolean
    default: true

runs:
  using: 'composite'
  steps:
    - name: Show Cache Folder Stats
      uses: ./.github/actions/cache-folder-stats
