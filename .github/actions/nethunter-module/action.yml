name: 'Build NetHunter Wireless Module'
description: 'Packages compiled wireless DLKM modules and firmware into a flashable KernelSU-Next / SukiSU-Ultra / ReSukiSU module'
inputs:
  file_name:
    description: 'Output filename prefix (optional)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Package NetHunter Wireless Module
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        STAGING_DIR="${{ github.workspace }}/nethunter-module-staging"
        rm -rf "$STAGING_DIR"
        mkdir -p "$STAGING_DIR/lkm"
        mkdir -p "$STAGING_DIR/system/etc/firmware"

        echo "=== Collecting compiled .ko modules into single lkm/ storage ==="
        KO_COUNT=0
        for search_path in "${{ github.workspace }}/kernel" "/home/runner/.cache/bazel" "/home/runner/out"; do
          if [ -d "$search_path" ]; then
            echo "Scanning $search_path for compiled .ko modules..."
            while IFS= read -r ko; do
              if [ -f "$ko" ]; then
                modname=$(basename "$ko")
                echo "Found module: $modname ($ko)"
                cp -vf "$ko" "$STAGING_DIR/lkm/" 2>/dev/null || true
                KO_COUNT=$((KO_COUNT+1))
              fi
            done < <(find -L "$search_path" -type f -name "*.ko" 2>/dev/null || true)
          fi
        done

        echo "Total modules collected: $KO_COUNT"

        echo "=== Fetching Wireless & SDR Firmware ==="
        FIRMWARE_DIR="$STAGING_DIR/system/etc/firmware"

        # Download standard Realtek, Atheros, MediaTek, Ralink, and ZyDAS firmware
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/rt2870.bin" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin" 2>/dev/null || true
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/mt7601u.bin" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mt7601u.bin" 2>/dev/null || true
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/carl9170-1.fw" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/carl9170-1.fw" 2>/dev/null || true

        mkdir -p "$FIRMWARE_DIR/mediatek"
        for fw in mt7662u.bin mt7662u_rom_patch.bin mt7610u.bin; do
          curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/mediatek/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/$fw" 2>/dev/null || true
        done

        mkdir -p "$FIRMWARE_DIR/rtw88"
        for fw in rtw8822c_fw.bin rtw8822b_fw.bin rtw8821c_fw.bin rtw8723d_fw.bin; do
          curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/rtw88/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" 2>/dev/null || true
        done

        mkdir -p "$FIRMWARE_DIR/rtlwifi"
        for fw in rtl8192cufw.bin rtl8188eufw.bin rtl8723aufw_B.bin rtl8192eu_nic.bin rtl8723bu_nic.bin rtl8188eu_nic.bin; do
          curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/rtlwifi/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/$fw" 2>/dev/null || true
        done

        mkdir -p "$FIRMWARE_DIR/ath9k_htc"
        for fw in htc_9271.fw htc_7010.fw htc_9271-1.4.0.fw htc_7010-1.4.0.fw; do
          curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/ath9k_htc/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/$fw" 2>/dev/null || true
        done

        mkdir -p "$FIRMWARE_DIR/zd1211"
        for fw in zd1211_ub zd1211_uphr zd1211_ur zd1211b_ub zd1211b_uphr zd1211b_ur; do
          curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/zd1211/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/zd1211/$fw" 2>/dev/null || true
        done

        echo "=== Creating Module Metadata & Scripts ==="
        printf 'id=nethunter_wireless_modules\n' > "$STAGING_DIR/module.prop"
        printf 'name=Nethunter Wireless,HID Driver & Modules\n' >> "$STAGING_DIR/module.prop"
        printf 'version=v1.2\n' >> "$STAGING_DIR/module.prop"
        printf 'versionCode=120\n' >> "$STAGING_DIR/module.prop"
        printf 'author=abidhasansojib\n' >> "$STAGING_DIR/module.prop"
        printf 'description=External USB WiFi (RTW88, RTL8xxxu, ATH9K-HTC, CARL9170, RT2800, MT76, ZD1211), BadUSB HID Gadget permissions, SDR, CAN-Bus, and NetHunter drivers for Android 16 (6.12) GKI\n' >> "$STAGING_DIR/module.prop"

        # --- Flashing Script (customize.sh) ---
        cat << 'EOF' > "$STAGING_DIR/customize.sh"
        #!/system/bin/sh
        SKIPUNZIP=0

        ui_print "************************************************"
        ui_print "   Nethunter Wireless, HID Driver & Modules     "
        ui_print "    Android 16 GKI (Linux 6.12) Driver Stack    "
        ui_print "    Author: abidhasansojib                      "
        ui_print "************************************************"
        ui_print "- Installing unified driver stack into lkm/..."
        ui_print "- Configuring dynamic firmware detection..."

        set_perm_recursive "$MODPATH" 0 0 0755 0644
        set_perm "$MODPATH/service.sh" 0 0 0755
        set_perm "$MODPATH/post-fs-data.sh" 0 0 0755
        EOF
        sed -i 's/^[[:space:]]*//' "$STAGING_DIR/customize.sh"

        # --- SELinux Policy Rules (sepolicy.rule) ---
        cat << 'EOF' > "$STAGING_DIR/sepolicy.rule"
        allow shell hidraw_device chr_file { read write open ioctl getattr }
        allow shell uhid_device chr_file { read write open ioctl getattr }
        allow shell tun_device chr_file { read write open ioctl getattr }
        allow shell usb_device chr_file { read write open ioctl getattr }
        allow shell usb_device dir { read open search getattr }
        allow shell tty_device chr_file { read write open ioctl getattr }
        allow shell rfkill_device chr_file { read write open ioctl getattr }
        allow shell configfs dir { read open search write add_name remove_name create }
        allow shell configfs file { read write open getattr }
        EOF
        sed -i 's/^[[:space:]]*//' "$STAGING_DIR/sepolicy.rule"

        # --- Early Boot Initialization (post-fs-data.sh) ---
        cat << 'EOF' > "$STAGING_DIR/post-fs-data.sh"
        #!/system/bin/sh
        MODDIR=${0%/*}

        # Ensure /dev/net directory and tun device node exist for VPNs & packet manipulation
        mkdir -p /dev/net
        if [ ! -c /dev/net/tun ]; then
          mknod /dev/net/tun c 10 200 2>/dev/null || true
        fi
        chmod 666 /dev/net/tun /dev/rfkill /dev/uhid /dev/hidg* 2>/dev/null || true

        # Dynamically detect and populate runtime firmware paths
        for fw_target in /vendor/firmware /vendor/etc/firmware /system/etc/firmware; do
          if [ -d "$fw_target" ] && [ -w "$fw_target" ] && [ -d "$MODDIR/system/etc/firmware" ]; then
            cp -rf "$MODDIR/system/etc/firmware/"* "$fw_target/" 2>/dev/null || true
          fi
        done

        # Early load core wireless & CAN dependencies from lkm/
        for core_ko in cfg80211.ko mac80211.ko rtw88_core.ko rtw88_usb.ko rtw88_8822b.ko rtw88_8822c.ko rtw88_8821c.ko rtw8723d.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x2-common.ko can.ko can-dev.ko can-raw.ko can-bcm.ko can-gw.ko; do
          if [ -f "$MODDIR/lkm/$core_ko" ]; then
            modbase=$(echo "${core_ko%.ko}" | tr '-' '_')
            if ! lsmod 2>/dev/null | grep -q "^${modbase}[[:space:]]"; then
              insmod "$MODDIR/lkm/$core_ko" 2>/dev/null || ksud insmod "$MODDIR/lkm/$core_ko" 2>/dev/null || true
            fi
          fi
        done
        EOF
        sed -i 's/^[[:space:]]*//' "$STAGING_DIR/post-fs-data.sh"
        chmod +x "$STAGING_DIR/post-fs-data.sh"

        # --- Native ueventd Hotplug Rules (0% CPU / 0 Battery Drain) ---
        cat << 'EOF' > "$STAGING_DIR/system/etc/ueventd.rc"
        /dev/hidg*                0666   root   root
        /dev/uhid                 0666   root   root
        /dev/rfkill               0666   root   root
        /dev/net/tun              0666   root   root
        /dev/ttyUSB*              0666   root   root
        /dev/ttyACM*              0666   root   root
        /dev/rfcomm*              0666   root   root
        /dev/bus/usb/*/*          0666   root   root
        EOF
        sed -i 's/^[[:space:]]*//' "$STAGING_DIR/system/etc/ueventd.rc"
        cp -vf "$STAGING_DIR/system/etc/ueventd.rc" "$STAGING_DIR/ueventd.rc" 2>/dev/null || true

        # --- Late Boot Service & Driver Loader (service.sh) ---
        cat << 'EOF' > "$STAGING_DIR/service.sh"
        #!/system/bin/sh
        MODDIR=${0%/*}

        # Set permissions for NetHunter BadUSB, Wi-Fi, SDR, Serial & VPN devices once on boot
        chmod 666 /dev/hidg* /dev/uhid /dev/rfkill /dev/net/tun 2>/dev/null || true
        chmod 666 /dev/ttyUSB* /dev/ttyACM* /dev/rfcomm* 2>/dev/null || true
        chmod -R 666 /dev/bus/usb/ 2>/dev/null || true

        # Multi-Pass Module Loader from single lkm/ directory
        MODULE_SRC="$MODDIR/lkm"
        if [ -d "$MODULE_SRC" ]; then
          # Priority 1: Core dependencies
          for core_ko in cfg80211.ko mac80211.ko rtw88_core.ko rtw88_usb.ko rtw88_8822b.ko rtw88_8822c.ko rtw88_8821c.ko rtw8723d.ko mt76.ko mt76-usb.ko mt76x02-lib.ko mt76x02-usb.ko mt76x2-common.ko can.ko can-dev.ko can-raw.ko can-bcm.ko can-gw.ko; do
            if [ -f "$MODULE_SRC/$core_ko" ]; then
              modbase=$(echo "${core_ko%.ko}" | tr '-' '_')
              if ! lsmod 2>/dev/null | grep -q "^${modbase}[[:space:]]"; then
                insmod "$MODULE_SRC/$core_ko" 2>/dev/null || ksud insmod "$MODULE_SRC/$core_ko" 2>/dev/null || true
              fi
            fi
          done

          # Priority 2: Multi-Pass Loader for all remaining drivers
          for pass in 1 2 3; do
            for ko in "$MODULE_SRC"/*.ko; do
              [ -f "$ko" ] || continue
              modname=$(basename "$ko")
              modbase=$(echo "${modname%.ko}" | tr '-' '_')
              if ! lsmod 2>/dev/null | grep -q "^${modbase}[[:space:]]"; then
                insmod "$ko" 2>/dev/null || ksud insmod "$ko" 2>/dev/null || true
              fi
            done
          done
        fi
        EOF
        sed -i 's/^[[:space:]]*//' "$STAGING_DIR/service.sh"
        chmod +x "$STAGING_DIR/service.sh"

        OUT_ZIP="${{ github.workspace }}/Nethunter-Wireless-Module.zip"
        echo "Creating flashable module zip at: $OUT_ZIP"
        (cd "$STAGING_DIR" && zip -r -q -9 "$OUT_ZIP" .)

        mkdir -p "${{ github.workspace }}/artifacts/nethunter-module"
        cp -v "$OUT_ZIP" "${{ github.workspace }}/artifacts/nethunter-module/"

    - name: Upload NetHunter Wireless Module Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Nethunter-Wireless-Module
        path: ${{ github.workspace }}/artifacts/nethunter-module/
        if-no-files-found: warn
