name: 'Build NetHunter Wireless Module'
description: 'Packages compiled wireless DLKM modules and firmware into a flashable KernelSU / KernelSU-Next / ReSukiSU module'
inputs:
  file_name:
    description: 'Output filename prefix (optional)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Package NetHunter Wireless Module
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        STAGING_DIR="${{ github.workspace }}/nethunter-module-staging"
        rm -rf "$STAGING_DIR"
        mkdir -p "$STAGING_DIR/lkm"
        mkdir -p "$STAGING_DIR/system/lib/modules"
        mkdir -p "$STAGING_DIR/vendor/lib/modules"
        mkdir -p "$STAGING_DIR/vendor_dlkm/lib/modules"
        mkdir -p "$STAGING_DIR/system/etc/firmware"
        mkdir -p "$STAGING_DIR/vendor/etc/firmware"
        mkdir -p "$STAGING_DIR/vendor/firmware"

        echo "=== Collecting compiled .ko modules ==="
        KO_COUNT=0
        for search_path in "${{ github.workspace }}/kernel" "/home/runner/.cache/bazel" "/home/runner/out"; do
          if [ -d "$search_path" ]; then
            echo "Scanning $search_path for compiled .ko modules..."
            while IFS= read -r ko; do
              if [ -f "$ko" ]; then
                modname=$(basename "$ko")
                echo "Found module: $modname ($ko)"
                cp -vf "$ko" "$STAGING_DIR/system/lib/modules/" 2>/dev/null || true
                cp -vf "$ko" "$STAGING_DIR/vendor/lib/modules/" 2>/dev/null || true
                cp -vf "$ko" "$STAGING_DIR/vendor_dlkm/lib/modules/" 2>/dev/null || true
                cp -vf "$ko" "$STAGING_DIR/lkm/" 2>/dev/null || true
                KO_COUNT=$((KO_COUNT+1))
              fi
            done < <(find -L "$search_path" -type f -name "*.ko" 2>/dev/null || true)
          fi
        done

        echo "Total modules collected: $KO_COUNT"

        echo "=== Fetching Wireless & SDR Firmware ==="
        FIRMWARE_DIR="/tmp/linux-firmware-dl"
        rm -rf "$FIRMWARE_DIR"
        mkdir -p "$FIRMWARE_DIR"

        # Download standard Realtek, Atheros, MediaTek, Ralink, and ZyDAS firmware
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/rt2870.bin" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin" 2>/dev/null || true
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/mt7601u.bin" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mt7601u.bin" 2>/dev/null || true
        curl -LSs --retry 5 --retry-delay 5 -o "$FIRMWARE_DIR/carl9170-1.fw" \
          "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/carl9170-1.fw" 2>/dev/null || true

        mkdir -p "$STAGING_DIR/system/etc/firmware/rtw88" "$STAGING_DIR/vendor/etc/firmware/rtw88" "$STAGING_DIR/vendor/firmware/rtw88"
        for fw in rtw8822c_fw.bin rtw8822b_fw.bin rtw8821c_fw.bin rtw8723d_fw.bin; do
          curl -LSs --retry 5 --retry-delay 5 -o "$STAGING_DIR/system/etc/firmware/rtw88/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/$fw" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/rtw88/$fw" "$STAGING_DIR/vendor/etc/firmware/rtw88/" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/rtw88/$fw" "$STAGING_DIR/vendor/firmware/rtw88/" 2>/dev/null || true
        done

        mkdir -p "$STAGING_DIR/system/etc/firmware/rtlwifi" "$STAGING_DIR/vendor/etc/firmware/rtlwifi" "$STAGING_DIR/vendor/firmware/rtlwifi"
        for fw in rtl8192cufw.bin rtl8188eufw.bin rtl8723aufw_B.bin; do
          curl -LSs --retry 5 --retry-delay 5 -o "$STAGING_DIR/system/etc/firmware/rtlwifi/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/$fw" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/rtlwifi/$fw" "$STAGING_DIR/vendor/etc/firmware/rtlwifi/" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/rtlwifi/$fw" "$STAGING_DIR/vendor/firmware/rtlwifi/" 2>/dev/null || true
        done

        mkdir -p "$STAGING_DIR/system/etc/firmware/ath9k_htc" "$STAGING_DIR/vendor/etc/firmware/ath9k_htc" "$STAGING_DIR/vendor/firmware/ath9k_htc"
        for fw in htc_9271.fw htc_7010.fw; do
          curl -LSs --retry 5 --retry-delay 5 -o "$STAGING_DIR/system/etc/firmware/ath9k_htc/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/$fw" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/ath9k_htc/$fw" "$STAGING_DIR/vendor/etc/firmware/ath9k_htc/" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/ath9k_htc/$fw" "$STAGING_DIR/vendor/firmware/ath9k_htc/" 2>/dev/null || true
        done

        mkdir -p "$STAGING_DIR/system/etc/firmware/zd1211" "$STAGING_DIR/vendor/etc/firmware/zd1211" "$STAGING_DIR/vendor/firmware/zd1211"
        for fw in zd1211_ub zd1211_uphr zd1211_ur zd1211b_ub zd1211b_uphr zd1211b_ur; do
          curl -LSs --retry 5 --retry-delay 5 -o "$STAGING_DIR/system/etc/firmware/zd1211/$fw" \
            "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/zd1211/$fw" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/zd1211/$fw" "$STAGING_DIR/vendor/etc/firmware/zd1211/" 2>/dev/null || true
          cp -vf "$STAGING_DIR/system/etc/firmware/zd1211/$fw" "$STAGING_DIR/vendor/firmware/zd1211/" 2>/dev/null || true
        done

        cp -v "$FIRMWARE_DIR"/* "$STAGING_DIR/system/etc/firmware/" 2>/dev/null || true
        cp -v "$FIRMWARE_DIR"/* "$STAGING_DIR/vendor/etc/firmware/" 2>/dev/null || true
        cp -v "$FIRMWARE_DIR"/* "$STAGING_DIR/vendor/firmware/" 2>/dev/null || true

        echo "=== Creating Module Metadata & Scripts ==="
        printf 'id=gki_nethunter_wireless\n' > "$STAGING_DIR/module.prop"
        printf 'name=GKI NetHunter Wireless, HID & Driver Modules\n' >> "$STAGING_DIR/module.prop"
        printf 'version=v1.1\n' >> "$STAGING_DIR/module.prop"
        printf 'versionCode=110\n' >> "$STAGING_DIR/module.prop"
        printf 'author=Abid Hasan Sojib\n' >> "$STAGING_DIR/module.prop"
        printf 'description=External USB WiFi (RTW88, RTL8xxxu, ATH9K-HTC, CARL9170, RT2800, MT76, ZD1211), BadUSB HID Gadget permissions, SDR, CAN-Bus, and NetHunter drivers for Android 16 (6.12) GKI\n' >> "$STAGING_DIR/module.prop"

        # --- SELinux Policy Rules (sepolicy.rule) ---
        # Allows NetHunter, Termux, and shell to access HID, USB, TUN, and serial devices without SELinux denials
        echo '' | base64 -d > "$STAGING_DIR/sepolicy.rule"

        # --- Early Boot Initialization (post-fs-data.sh) ---
        echo '' | base64 -d > "$STAGING_DIR/post-fs-data.sh"
        chmod +x "$STAGING_DIR/post-fs-data.sh"

        # --- Native ueventd Hotplug Rules (0% CPU / 0 Battery Drain) ---
        echo '' | base64 -d > "$STAGING_DIR/system/etc/ueventd.rc"
        cp -vf "$STAGING_DIR/system/etc/ueventd.rc" "$STAGING_DIR/ueventd.rc" 2>/dev/null || true

        # --- Late Boot Service & Driver Loader (service.sh) ---
        echo '' | base64 -d > "$STAGING_DIR/service.sh"
        chmod +x "$STAGING_DIR/service.sh"

        OUT_ZIP="${{ github.workspace }}/Nethunter-Wireless-Module.zip"
        echo "Creating flashable module zip at: $OUT_ZIP"
        (cd "$STAGING_DIR" && zip -r -q -9 "$OUT_ZIP" .)

        mkdir -p "${{ github.workspace }}/artifacts/nethunter-module"
        cp -v "$OUT_ZIP" "${{ github.workspace }}/artifacts/nethunter-module/"

    - name: Upload NetHunter Wireless Module Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Nethunter-Wireless-Module
        path: ${{ github.workspace }}/artifacts/nethunter-module/
        if-no-files-found: warn
