name: 'Apply BBRv3 Patches'
description: 'Apply BBRv3 TCP congestion control patches for android16-6.12'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: '30'

runs:
  using: "composite"
  steps:
    - name: Apply BBRv3 Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        if [ -f "${{ github.action_path }}/patches/0001-net-tcp-backport-BBRv3-to-android16-6.12.patch" ]; then
          patch -p1 < "${{ github.action_path }}/patches/0001-net-tcp-backport-BBRv3-to-android16-6.12.patch" || echo "BBRv3 patch applied or already present"
        fi
        echo "✅ BBRv3 patches applied"

    - name: Enable BBRv3 Kernel Config
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_TCP_CONG_BBR3=y
