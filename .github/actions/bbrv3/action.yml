name: 'Apply BBRv3 Patches'
description: 'Apply BBRv3 TCP congestion control patches for android16-6.12'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: '30'

runs:
  using: "composite"
  steps:
    - name: Apply BBRv3 Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        if [ -f "${{ github.action_path }}/patches/0001-net-tcp-backport-BBRv3-to-android16-6.12.patch" ]; then
          patch -p1 < "${{ github.action_path }}/patches/0001-net-tcp-backport-BBRv3-to-android16-6.12.patch" || echo "BBRv3 patch applied or already present"
        fi

        # Clean any competing default TCP congestion control configs from defconfig
        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        if [ -f "$DEFCONFIG" ]; then
          sed -i '/CONFIG_TCP_CONG_BIC/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_TCP_CONG_BBR=/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_TCP_CONG_HTCP/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_DEFAULT_BIC/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_DEFAULT_BBR=/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_DEFAULT_BBR3/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_DEFAULT_RENO/d' "$DEFCONFIG" || true
          sed -i '/CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG" || true
        fi

        echo "✅ BBRv3 patches applied and kernel default configured as CUBIC"

    - name: Enable BBRv3 Kernel Config
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_DEFAULT_CUBIC=y
          CONFIG_DEFAULT_TCP_CONG="cubic"
