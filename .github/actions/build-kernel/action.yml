name: 'Build Kernel'
description: 'Builds kernel using Bazel (kleaf) with automatic vendor module version bypass'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'

runs:
  using: composite
  steps:
  - name: 'Apply Kernel Version-Check Bypass Hack'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"

      if [ -f "$TARGET_FILE" ]; then
        echo "Applying vendor module version-check bypass hack to $TARGET_FILE..."
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "Patch failed! 'return 1;' not found at bad_version:"
          grep -A 10 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi
        echo "✅ Vendor module version-check bypass hack successfully applied"
      else
        echo "WARNING: $TARGET_FILE not found, checking legacy module.c"
        if [ -f "${{ github.workspace }}/kernel/common/kernel/module.c" ]; then
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "${{ github.workspace }}/kernel/common/kernel/module.c"
        fi
      fi

  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel || true

      tools/bazel build \
        --config=fast \
        --config=stamp \
        --allow_undeclared_modules \
        --nokmi_symbol_list_strict_mode \
        --nokmi_symbol_list_violations_check \
        --notrim \
        --disk_cache=/home/runner/.cache/bazel \
        //common:kernel_aarch64 \
        //common:kernel_aarch64/Image

      # Also build module/dist targets if available
      tools/bazel build \
        --config=fast \
        --config=stamp \
        --allow_undeclared_modules \
        --nokmi_symbol_list_strict_mode \
        --nokmi_symbol_list_violations_check \
        --notrim \
        --disk_cache=/home/runner/.cache/bazel \
        //common:kernel_aarch64_dist 2>/dev/null || true

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1
