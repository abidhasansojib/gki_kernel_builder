name: 'Build Kernel'
description: 'Builds kernel using Bazel (kleaf) with automatic vendor module version bypass'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'

runs:
  using: composite
  steps:
  - name: 'Apply Kernel Version-Check Bypass Hack'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"

      if [ -f "$TARGET_FILE" ]; then
        echo "Applying vendor module version-check bypass hack to $TARGET_FILE..."
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "Patch failed! 'return 1;' not found at bad_version:"
          grep -A 10 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi
        echo "✅ Vendor module version-check bypass hack successfully applied"
      else
        echo "WARNING: $TARGET_FILE not found, checking legacy module.c"
        if [ -f "${{ github.workspace }}/kernel/common/kernel/module.c" ]; then
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "${{ github.workspace }}/kernel/common/kernel/module.c"
        fi
      fi

  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      # Kleaf evaluates build.config.gki.aarch64 in its own hermetic environment,
      # so job-level SOURCE_DATE_EPOCH / KBUILD_BUILD_TIMESTAMP must be exported
      # inside build.config.gki.aarch64 to reach the kernel build.
      BUILD_CONFIG_FILE="common/build.config.gki.aarch64"
      if [ -f "$BUILD_CONFIG_FILE" ]; then
        if ! grep -q 'Reproducible timestamp injected by the CI workflow' "$BUILD_CONFIG_FILE"; then
          printf '\n# Reproducible timestamp injected by the CI workflow.\nexport SOURCE_DATE_EPOCH=%q\nexport KBUILD_BUILD_TIMESTAMP=%q\n' \
            "${SOURCE_DATE_EPOCH:-0}" "${KBUILD_BUILD_TIMESTAMP:-@0}" >> "$BUILD_CONFIG_FILE"
          echo "[INFO] build.config.gki.aarch64: exported SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH:-0}"
        fi
      fi

      sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel || true

      tools/bazel build \
        --config=fast \
        --config=stamp \
        --allow_undeclared_modules \
        --nokmi_symbol_list_strict_mode \
        --nokmi_symbol_list_violations_check \
        --notrim \
        --disk_cache=/home/runner/.cache/bazel \
        //common:kernel_aarch64 \
        //common:kernel_aarch64/Image

      # Also build module/dist targets if available
      tools/bazel build \
        --config=fast \
        --config=stamp \
        --allow_undeclared_modules \
        --nokmi_symbol_list_strict_mode \
        --nokmi_symbol_list_violations_check \
        --notrim \
        --disk_cache=/home/runner/.cache/bazel \
        //common:kernel_aarch64_dist 2>/dev/null || true

  - name: 'Verify Final .config and SUSFS Presence in Image'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      CONFIG_FILE=""
      for candidate in \
        bazel-bin/common/kernel_aarch64_config/out_dir/.config \
        /home/runner/out/.config; do
        if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
      done
      if [ -z "$CONFIG_FILE" ]; then
        CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
      fi

      if [ -n "$CONFIG_FILE" ] && [ -f "$CONFIG_FILE" ]; then
        echo "--- KSU & SUSFS config block from final $CONFIG_FILE ---"
        grep -E '^#? ?CONFIG_KSU|^#? ?CONFIG_KPM' "$CONFIG_FILE" || true
        if ! grep -q '^CONFIG_KSU=y' "$CONFIG_FILE"; then
          echo "ERROR: CONFIG_KSU=y missing from final .config" >&2
          exit 1
        fi
        if ! grep -q '^CONFIG_KSU_SUSFS=y' "$CONFIG_FILE"; then
          echo "ERROR: CONFIG_KSU_SUSFS=y missing from final .config" >&2
          exit 1
        fi
      fi

      for img in bazel-bin/common/kernel_aarch64/Image /home/runner/out/dist/Image; do
        if [ -f "$img" ]; then
          echo "SUSFS strings in $(basename "$img"): $(grep -ac susfs "$img" || true)"
          break
        fi
      done

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1
