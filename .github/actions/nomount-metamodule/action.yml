name: Fetch Official NoMount Metamodule Release ZIP
description: Download the official prebuilt NoMount metamodule ZIP from maxsteeel/nomount releases
inputs:
  output_dir:
    description: 'Directory to save the downloaded NoMount release ZIP'
    required: false
    default: '${{ github.workspace }}/nomount-dist'
  token:
    description: 'GitHub token for API authentication'
    required: false
    default: '${{ github.token }}'
outputs:
  module_path:
    description: 'Path to the downloaded official NoMount metamodule ZIP'
    value: ${{ steps.fetch.outputs.module_path }}

runs:
  using: composite
  steps:
    - name: Fetch Official NoMount Release ZIP
      id: fetch
      shell: bash
      run: |
        set -euo pipefail

        OUT_DIR="${{ inputs.output_dir }}"
        GH_TOKEN="${{ inputs.token }}"
        mkdir -p "$OUT_DIR"

        echo "[+] Fetching latest official NoMount release ZIP from maxsteeel/nomount..."
        url=""

        if command -v gh >/dev/null 2>&1; then
          url=$(gh api repos/maxsteeel/nomount/releases/latest --jq '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' 2>/dev/null | head -n 1 || true)
          if [ -z "$url" ]; then
            url=$(gh api repos/maxsteeel/nomount/releases --jq '.[0].assets[] | select(.name | endswith(".zip")) | .browser_download_url' 2>/dev/null | head -n 1 || true)
          fi
        fi

        if [ -z "$url" ]; then
          auth_header=(-H "Accept: application/vnd.github+json" -H "User-Agent: curl/8.0")
          if [ -n "$GH_TOKEN" ]; then
            auth_header+=(-H "Authorization: Bearer $GH_TOKEN")
          fi
          rel_json=$(curl -fsSL --retry 5 --retry-delay 3 "${auth_header[@]}" \
            "https://api.github.com/repos/maxsteeel/nomount/releases/latest" 2>/dev/null || true)
          if [ -n "$rel_json" ]; then
            url=$(echo "$rel_json" | grep -o '"browser_download_url": *"[^"]*\.zip"' | sed -e 's/"browser_download_url": *"//' -e 's/"$//' | head -n 1 || true)
          fi
        fi

        if [ -z "$url" ]; then
          echo "ERROR: Could not find official NoMount release ZIP on maxsteeel/nomount" >&2
          exit 1
        fi

        fname="${url##*/}"
        target_path="${OUT_DIR}/${fname}"
        echo "[+] Downloading official NoMount release: $fname from $url"
        curl -fsSL --retry 5 --retry-delay 3 -o "$target_path" "$url"
        sha256sum "$target_path" > "${target_path}.sha256"
        echo "[+] Saved official NoMount release: $target_path"
        echo "module_path=$target_path" >> "$GITHUB_OUTPUT"
