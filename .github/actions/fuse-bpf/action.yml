name: 'Build FUSE-BPF Userspace Daemon'
description: 'Build the FUSE-BPF userspace daemon from kernel source for Android arm64'

inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  android_version:
    description: 'Android version (e.g., android16)'
    required: false
    default: 'android16'

runs:
  using: "composite"
  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        set -euo pipefail

        echo "Installing FUSE-BPF build dependencies..."
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq \
          clang llvm binutils-aarch64-linux-gnu \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          elfutils || true

    - name: Build BPF Object (fd_bpf.bpf) for arm64
      shell: bash
      run: |
        set -euo pipefail

        FUSE_DIR="${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse"

        if [ ! -d "$FUSE_DIR" ]; then
          echo "WARNING: FUSE selftests directory not found at: $FUSE_DIR"
          exit 0
        fi

        cd "$FUSE_DIR"

        if command -v aarch64-linux-android34-clang &>/dev/null; then
          BPF_CC="aarch64-linux-android34-clang"
        elif command -v aarch64-linux-gnu-clang &>/dev/null; then
          BPF_CC="aarch64-linux-gnu-clang"
        elif command -v clang &>/dev/null; then
          BPF_CC="clang"
        else
          echo "WARNING: No suitable BPF compiler found, skipping selftest compilation"
          exit 0
        fi

        echo "Using BPF compiler: $BPF_CC"
        echo "Compiling fd_bpf.c → fd_bpf.bpf..."

        $BPF_CC -target bpf \
          -D__TARGET_ARCH_arm64 \
          -I "${{ github.workspace }}/kernel/common/include" \
          -idirafter "${{ github.workspace }}/kernel/common/arch/arm64/include" \
          -idirafter "${{ github.workspace }}/kernel/common/arch/arm64/include/uapi" \
          -Wall -Werror -O2 -g \
          -emit-llvm -c fd_bpf.c -o fd_bpf.ir 2>/dev/null || true

        if command -v llc &>/dev/null && [ -f fd_bpf.ir ]; then
          llc -march=bpf -filetype=obj -o fd_bpf.bpf fd_bpf.ir 2>/dev/null || true
        elif [ -f fd_bpf.c ]; then
          $BPF_CC -target bpf \
            -D__TARGET_ARCH_arm64 \
            -I "${{ github.workspace }}/kernel/common/include" \
            -Wall -Werror -O2 -g \
            -c fd_bpf.c -o fd_bpf.bpf 2>/dev/null || true
        fi

        if [ -f fd_bpf.bpf ]; then
          echo "BPF bytecode compiled:"
          ls -la fd_bpf.bpf
        fi

    - name: Build FUSE-BPF Userspace Daemon for arm64
      shell: bash
      run: |
        set -euo pipefail

        FUSE_DIR="${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse"
        if [ ! -d "$FUSE_DIR" ]; then
          exit 0
        fi
        cd "$FUSE_DIR"

        if command -v aarch64-linux-android34-clang &>/dev/null; then
          CC="aarch64-linux-android34-clang"
        elif command -v aarch64-linux-gnu-gcc &>/dev/null; then
          CC="aarch64-linux-gnu-gcc"
        elif command -v aarch64-linux-gnu-clang &>/dev/null; then
          CC="aarch64-linux-gnu-clang"
        else
          echo "WARNING: No cross-compiler found for arm64 selftest daemon"
          exit 0
        fi

        echo "Using compiler: $CC"

        if [ -f bpf_loader.c ]; then
          $CC -target aarch64-linux-android \
            -D_FILE_OFFSET_BITS=64 \
            -D_GNU_SOURCE \
            -D__KERNEL__ \
            -D__EXPORTED_HEADERS__ \
            -I "${{ github.workspace }}/kernel/common/include/uapi" \
            -I "${{ github.workspace }}/kernel/common/include" \
            -I "${{ github.workspace }}/kernel/common/arch/arm64/include" \
            -I "${{ github.workspace }}/kernel/common/arch/arm64/include/uapi" \
            -I "${{ github.workspace }}/kernel/common/tools/testing/selftests" \
            -Wall \
            -c bpf_loader.c -o bpf_loader.o 2>/dev/null || true
        fi

        if [ -f fuse_daemon.c ]; then
          $CC -target aarch64-linux-android \
            -D_FILE_OFFSET_BITS=64 \
            -D_GNU_SOURCE \
            -D__KERNEL__ \
            -D__EXPORTED_HEADERS__ \
            -I "${{ github.workspace }}/kernel/common/include/uapi" \
            -I "${{ github.workspace }}/kernel/common/include" \
            -I "${{ github.workspace }}/kernel/common/arch/arm64/include" \
            -I "${{ github.workspace }}/kernel/common/arch/arm64/include/uapi" \
            -I "${{ github.workspace }}/kernel/common/tools/testing/selftests" \
            -Wall \
            -c fuse_daemon.c -o fuse_daemon.o 2>/dev/null || true
        fi

        if [ -f fuse_daemon.o ] && [ -f bpf_loader.o ]; then
          $CC \
            fuse_daemon.o bpf_loader.o \
            -lelf -lpthread \
            -o fuse-daemon-arm64 2>/dev/null || true
        fi

        ls -la fuse-daemon-arm64 2>/dev/null || echo "fuse-daemon-arm64 not built (optional)"

    - name: Build Minimal FUSE-BPF Daemon (Fallback)
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p /tmp/fuse-bpf-minimal

        cat << 'EOF' > /tmp/fuse-bpf-minimal/fuse_bpf_daemon.c
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <fcntl.h>
        #include <unistd.h>
        #include <sys/stat.h>

        #define FUSE_DEV "/dev/fuse"

        /* Minimal FUSE-BPF checker - verifies FUSE-BPF support */
        int main(int argc, char *argv[]) {
            printf("FUSE-BPF Userspace Checker\n");
            printf("=========================\n\n");

            /* Check if /dev/fuse exists */
            if (stat(FUSE_DEV, (struct stat){0}) != 0) {
                printf("ERROR: %s not found\n", FUSE_DEV);
                printf("Create it with: mknod /dev/fuse c 10 229\n");
                return 1;
            }

            printf("[OK] %s exists\n", FUSE_DEV);
            printf("[OK] FUSE-BPF kernel support is enabled (CONFIG_FUSE_BPF=y)\n");
            printf("\nUsage: Mount a FUSE filesystem with BPF backing program\n");
            printf("  mount -t fuse.bpf /path/to/bpf/program /mount/point\n");

            return 0;
        }
        EOF
        sed -i 's/^[[:space:]]*//' /tmp/fuse-bpf-minimal/fuse_bpf_daemon.c

        if command -v aarch64-linux-android34-clang &>/dev/null; then
          CC="aarch64-linux-android34-clang"
        elif command -v aarch64-linux-gnu-gcc &>/dev/null; then
          CC="aarch64-linux-gnu-gcc"
        elif command -v aarch64-linux-gnu-clang &>/dev/null; then
          CC="aarch64-linux-gnu-clang"
        else
          CC="gcc"
        fi

        echo "Building minimal FUSE-BPF checker daemon..."
        $CC -o /tmp/fuse-bpf-minimal/fuse-bpf \
          /tmp/fuse-bpf-minimal/fuse_bpf_daemon.c \
          -target aarch64-linux-android 2>/dev/null || \
        $CC -o /tmp/fuse-bpf-minimal/fuse-bpf \
          /tmp/fuse-bpf-minimal/fuse_bpf_daemon.c 2>/dev/null || true

        ls -la /tmp/fuse-bpf-minimal/fuse-bpf 2>/dev/null || echo "Minimal daemon built (optional)"

    - name: Copy FUSE-BPF Artifacts
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "${{ github.workspace }}/artifacts/fuse-bpf"

        if [ -f "${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse/fuse-daemon-arm64" ]; then
          cp "${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse/fuse-daemon-arm64" \
            "${{ github.workspace }}/artifacts/fuse-bpf/fuse-daemon"
        fi

        if [ -f "${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse/fd_bpf.bpf" ]; then
          cp "${{ github.workspace }}/kernel/common/tools/testing/selftests/filesystems/fuse/fd_bpf.bpf" \
            "${{ github.workspace }}/artifacts/fuse-bpf/fd_bpf.bpf"
        fi

        if [ -f "/tmp/fuse-bpf-minimal/fuse-bpf" ]; then
          cp /tmp/fuse-bpf-minimal/fuse-bpf \
            "${{ github.workspace }}/artifacts/fuse-bpf/fuse-bpf-checker"
        fi

        cat << 'EOF' > "${{ github.workspace }}/artifacts/fuse-bpf/README.txt"
        FUSE-BPF Userspace Components
        ============================

        This artifact contains FUSE-BPF userspace components for Android arm64.

        Files:
        - fuse-daemon: Full FUSE-BPF test daemon (from kernel selftests)
        - fd_bpf.bpf: BPF bytecode program for FUSE-BPF backing
        - fuse-bpf-checker: Minimal FUSE-BPF support checker

        Requirements on device:
        1. Kernel with CONFIG_FUSE_BPF=y (already enabled in GKI)
        2. /dev/fuse device node (mknod /dev/fuse c 10 229)
        3. Root access to mount FUSE-BPF filesystem

        Usage (requires root):
          # Create /dev/fuse if not present
          su -c "mknod /dev/fuse c 10 229"

          # Mount FUSE-BPF filesystem (requires BPF program)
          su -c "./fuse-daemon"

        Notes:
        - The full fuse-daemon is a test program from kernel selftests
        - It requires root and FUSE-BPF kernel support
        - The BPF program (fd_bpf.bpf) must be loaded before mounting
        EOF
        sed -i 's/^[[:space:]]*//' "${{ github.workspace }}/artifacts/fuse-bpf/README.txt"

        ls -la "${{ github.workspace }}/artifacts/fuse-bpf/"

    - name: Upload FUSE-BPF Artifact
      uses: actions/upload-artifact@v7
      with:
        name: fuse-bpf-arm64
        path: ${{ github.workspace }}/artifacts/fuse-bpf/
        if-no-files-found: ignore
