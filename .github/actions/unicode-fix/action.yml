name: 'Apply Unicode Fix Patch'
description: 'Apply scoped-storage invisible-character Unicode path filter patch'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'

runs:
  using: 'composite'
  steps:
    - name: Apply Scoped-Storage Unicode Path Filter
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        SCOPED_PATCH="${{ github.workspace }}/.github/patches/unicode-scoped/unicode_scoped_6.12.patch"
        echo "Applying scoped-storage Unicode path filter for 6.12 (FUSE-compatible, preserves emojis)..."
        patch -p1 --forward < "$SCOPED_PATCH"
        echo "Scoped-storage Unicode path filter applied ($(grep -c 'uc_path_check' include/linux/ucpath.h) helper, 4 syscall hooks)"
