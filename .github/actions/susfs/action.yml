name: 'Setup SUSFS'
description: 'Clone and apply SUSFS v2.4.0 patches and kernel configurations for SukiSU-Nova'
inputs:
  susfs_commit:
    description: 'SUSFS commit hash (empty = latest on auto-derived gki-{version} branch)'
    required: false
    default: ""
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: "android16-6.12"
  android_version:
    description: 'Android version (e.g., android16)'
    required: false
    default: "android16"
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: "6.12"
  os_patch_level:
    description: 'OS patch level (e.g., 2025-07)'
    required: false
    default: "2025-07"
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: "30"
  root_flavor:
    description: 'Selected root implementation (default: SukiSU-Nova)'
    required: false
    default: "SukiSU-Nova"

runs:
  using: "composite"
  steps:
    - name: Clone SUSFS Branch
      shell: bash
      run: |
        set -euo pipefail

        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        SUSFS_BRANCH="gki-${{ inputs.version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"
        echo "Cloning latest from $SUSFS_BRANCH..."
        retry git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu

        if [ -n "${{ inputs.susfs_commit }}" ]; then
          echo "Checking out SUSFS commit: ${{ inputs.susfs_commit }}"
          retry git -C "${{ github.workspace }}/susfs4ksu" checkout "${{ inputs.susfs_commit }}"
        fi

        cd "${{ github.workspace }}/susfs4ksu"
        SUSFS_COMMIT="$(git rev-parse HEAD)"
        echo "SUSFS_COMMIT=$SUSFS_COMMIT" >> "$GITHUB_ENV"
        echo "Using SUSFS commit: $SUSFS_COMMIT"

        for p in \
          "${{ github.workspace }}/kernel_patches/pershoot/susfs4ksu/0001-pershoot-Allow-core-to-be-built-with-no-features.patch" \
          "${{ github.workspace }}/kernel_patches/pershoot/susfs4ksu/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch"; do
          if [ -f "$p" ]; then
            echo "Applying patch: $(basename "$p")"
            patch -p1 < "$p" || echo "Patch $(basename "$p") already applied or skipped"
          fi
        done

    - name: Enable SUSFS for SukiSU-Nova
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        python3 "${{ github.workspace }}/.github/scripts/patch_sukisu_susfs.py" \
          --kernel-dir "${{ github.workspace }}/kernel"

    - name: Enable SUSFS Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y

    - name: Stage SUSFS Kernel Files
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/fs/"* "${{ github.workspace }}/kernel/common/fs/"
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/"* "${{ github.workspace }}/kernel/common/include/linux/"
        cp ${{ github.workspace }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.version }}.patch ./

        # Mark SUSFS credential helpers as __maybe_unused to avoid -Wunused-function under -Werror
        python3 "${{ github.workspace }}/.github/scripts/susfs_guard_priority_helpers.py" fs/susfs.c

        # Fix 6.12 getname_flags argument mismatch in patch
        if [ -f "50_add_susfs_in_gki-${{ inputs.version }}.patch" ]; then
          sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/g' "50_add_susfs_in_gki-${{ inputs.version }}.patch"
        fi

        # Restore missing susfs_open_redirect_spoof_vfs_statfs definition if deleted upstream
        if [ -f fs/susfs.c ] && ! grep -q "susfs_open_redirect_spoof_vfs_statfs" fs/susfs.c; then
          echo "[INFO] Restoring susfs_open_redirect_spoof_vfs_statfs in fs/susfs.c..."
          cat << 'EOF' > /tmp/susfs_statfs_stub.c
        #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
        int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf) {
        	struct st_susfs_open_redirect_hlist *entry = NULL;
        	int srcu_idx = srcu_read_lock(&susfs_srcu_open_redirect);

        	hash_for_each_possible_rcu(OPEN_REDIRECT_HLIST, entry, node, inode->i_ino) {
        		if (entry->reversed_lookup_only &&
        			entry->target_dev == inode->i_sb->s_dev)
        		{
        			SUSFS_LOGI("spoof kstatfs for redirected path: '%s'\n",
        					entry->info.target_pathname);
        			memcpy(buf, &entry->spoofed_kstatfs, sizeof(struct kstatfs));
        			srcu_read_unlock(&susfs_srcu_open_redirect, srcu_idx);
        			return 0;
        		}
        	}
        	srcu_read_unlock(&susfs_srcu_open_redirect, srcu_idx);
        	return -EINVAL;
        }
        #else
        int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf) {
        	return -EINVAL;
        }
        #endif
        EOF
          sed -i 's/^[[:space:]]*//' /tmp/susfs_statfs_stub.c
          cat /tmp/susfs_statfs_stub.c >> fs/susfs.c
          rm -f /tmp/susfs_statfs_stub.c
        fi

    - name: Adapt SUSFS Patch for Target Kernel Sublevel
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ -f "50_add_susfs_in_gki-${{ inputs.version }}.patch" ]; then
          python3 "${{ github.workspace }}/.github/scripts/adapt_susfs_patch.py" \
            --patch "50_add_susfs_in_gki-${{ inputs.version }}.patch" \
            --kernel-dir "${{ github.workspace }}/kernel/common"
        fi

    - name: Apply Kernel SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        patch -p1 < 50_add_susfs_in_gki-${{ inputs.version }}.patch

        # Extra safety check for getname_flags in fs/open.c
        if [ -f fs/open.c ]; then
          sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/g' fs/open.c
        fi

        # Fix fanotify_fdinfo signature mismatch when CONFIG_FANOTIFY is enabled alongside SUSFS show_fdinfo
        if [ -f fs/notify/fdinfo.c ]; then
          sed -i 's/static void fanotify_fdinfo(struct seq_file \*m, struct fsnotify_mark \*mark)/#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_SUS_KSTAT)\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n#else\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n#endif/' fs/notify/fdinfo.c
          echo "Patched fs/notify/fdinfo.c for SUSFS fanotify_fdinfo signature"
        fi

        # Fallback definition for VMA_PAD_START if not provided by kernel headers
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # Declare __fold_filemap_fixup_entry if referenced
        if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
          sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
          echo "Added page_size_compat.h include to fs/proc/task_mmu.c"
        fi

        # Clean up applied patch file to avoid committing untracked diff
        rm -f "50_add_susfs_in_gki-${{ inputs.version }}.patch"
