name: 'Setup NetHunter & Wireless Drivers'
description: 'Enable Kali NetHunter features, HID gadgets, and USB WiFi dongle drivers'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'

runs:
  using: "composite"
  steps:
    - name: Enable NetHunter Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # --- Core Wireless & Packet Injection (=m for GKI module compatibility) ---
          CONFIG_NET_CORE=y
          CONFIG_WIRELESS=y
          CONFIG_CFG80211=m
          CONFIG_NL80211_TESTMODE=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=m
          CONFIG_MAC80211_MESH=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_MAC80211_MESSAGE_TRACING=y
          CONFIG_RFKILL=m

          # --- USB HID Gadgets (BadUSB / Rubber Ducky / Keystroke Injection) ---
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_USB_HID=y
          CONFIG_UHID=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_F_HID=y

          # --- USB Arsenal Gadgets (Mass Storage, Serial, CDC-ACM, USB Ethernet) ---
          CONFIG_USB_ACM=m
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_EEM=y

          # --- USB Serial Adapters (Hardware Hacking / Router UART / JTAG) ---
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=m
          CONFIG_USB_SERIAL_FTDI_SIO=m
          CONFIG_USB_SERIAL_CP210X=m
          CONFIG_USB_SERIAL_PL2303=m

          # --- USB Wireless Drivers (=m for modular load & GKI compatibility) ---
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTW88=m
          CONFIG_RTW88_CORE=m
          CONFIG_RTW88_USB=m
          CONFIG_RTW88_8822B=m
          CONFIG_RTW88_8822C=m
          CONFIG_RTW88_8723D=m
          CONFIG_RTW88_8821C=m
          CONFIG_RTW88_8822BU=m
          CONFIG_RTW88_8822CU=m
          CONFIG_RTW88_8723DU=m
          CONFIG_RTW88_8821CU=m
          CONFIG_RTW88_LEDS=y
          CONFIG_RTL8187=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_RTL_CARDS=m
          CONFIG_RTL8192CU=m

          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=m
          CONFIG_CARL9170=m
          CONFIG_CARL9170_LEDS=y
          CONFIG_CARL9170_WPC=y
          CONFIG_ATH6KL=m
          CONFIG_ATH6KL_USB=m

          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y

          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m
          CONFIG_MT76_CORE=m
          CONFIG_MT76_USB=m
          CONFIG_MT76x02_LIB=m
          CONFIG_MT76x02_USB=m
          CONFIG_MT76x0U=m
          CONFIG_MT76x2_COMMON=m
          CONFIG_MT76x2U=m

          CONFIG_WLAN_VENDOR_ZYDAS=y
          CONFIG_ZD1211RW=m

          # --- USB Ethernet & Network Dongles (=m) ---
          CONFIG_USB_NET_DRIVERS=m
          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_AX8817X=m
          CONFIG_USB_NET_AX88179_178A=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_RTL8152=m
          CONFIG_USB_RTL8150=m

          # --- LED Trigger Triggers (for USB WiFi & CAN hardware status lights) ---
          CONFIG_NEW_LEDS=y
          CONFIG_LEDS_CLASS=y
          CONFIG_LEDS_TRIGGERS=y
          CONFIG_LEDS_TRIGGER_TIMER=y
          CONFIG_LEDS_TRIGGER_ONESHOT=y
          CONFIG_LEDS_TRIGGER_HEARTBEAT=y
          CONFIG_LEDS_TRIGGER_CPU=y
          CONFIG_LEDS_TRIGGER_DEFAULT_ON=y
          CONFIG_LEDS_TRIGGER_NETDEV=y
          CONFIG_RTW88_LEDS=y
          CONFIG_CAN_LEDS=y

          # --- Bluetooth & Bluetooth Arsenal (=m) ---
          CONFIG_BT=m
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=m
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIBCM203X=m
          CONFIG_BT_HCIBPA10X=m
          CONFIG_BT_HCIBFUSB=m
          CONFIG_BT_HCIVHCI=m

          # --- SDR (Software Defined Radio - RTL-SDR, HackRF, AirSpy, Mirics) ---
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y
          CONFIG_MEDIA_SDR_SUPPORT=y
          CONFIG_MEDIA_USB_SUPPORT=y
          CONFIG_MEDIA_SUBDRV_AUTOSELECT=n
          CONFIG_DVB_CORE=m
          CONFIG_DVB_DYNAMIC_MINORS=y
          CONFIG_DVB_USB_V2=m
          CONFIG_DVB_USB_RTL28XXU=m
          CONFIG_DVB_RTL2830=m
          CONFIG_DVB_RTL2832=m
          CONFIG_DVB_RTL2832_SDR=m
          CONFIG_DVB_SI2168=m
          CONFIG_DVB_ZD1301_DEMOD=m
          CONFIG_USB_HACKRF=m
          CONFIG_USB_AIRSPY=m
          CONFIG_USB_MSI2500=m

          # --- CAN Bus & Automotive Hacking (CARsenal / SocketCAN) ---
          CONFIG_CAN=m
          CONFIG_CAN_RAW=m
          CONFIG_CAN_BCM=m
          CONFIG_CAN_GW=m
          CONFIG_CAN_DEV=m
          CONFIG_CAN_CALC_BITTIMING=y
          CONFIG_CAN_LEDS=y
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_EMS_USB=m
          CONFIG_CAN_KVASER_USB=m
          CONFIG_CAN_PEAK_USB=m
          CONFIG_CAN_8DEV_USB=m
          CONFIG_CAN_GS_USB=m

          # --- Network File Systems (NFS Client/Server & CIFS/SMB) ---
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NFS_FS=y
          CONFIG_NFS_V2=y
          CONFIG_NFS_V3=y
          CONFIG_NFS_V3_ACL=y
          CONFIG_NFS_V4=y
          CONFIG_NFSD=y
          CONFIG_NFSD_V3_ACL=y
          CONFIG_NFSD_V4=y
          CONFIG_CIFS=y
          CONFIG_NETFS_SUPPORT=y
          CONFIG_KEYS=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y

          # --- General IPC & Chroot Enhancements ---
          CONFIG_SYSVIPC=y

    - name: Fix modules.bzl for built-in or modular overrides
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        echo "=== Synchronizing modules.bzl with kernel config ==="
        for bzl in $(find . -name "modules.bzl" 2>/dev/null); do
          echo "Sanitizing $bzl..."
          sed -i '/"fs\/netfs\/netfs\.ko",/d' "$bzl" 2>/dev/null || true
          sed -i '/"fs\/cifs\/cifs\.ko",/d' "$bzl" 2>/dev/null || true
          sed -i '/"fs\/nfsd\/nfsd\.ko",/d' "$bzl" 2>/dev/null || true
          sed -i '/"lib\/crypto\/libarc4\.ko",/d' "$bzl" 2>/dev/null || true
        done


