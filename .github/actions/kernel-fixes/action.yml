name: 'Kernel Fixes'
description: 'Applies compatibility fixes for android16-6.12'
inputs:
  version:
    required: false
    type: string
    default: 'android16-6.12'
  android_version:
    required: false
    type: string
    default: 'android16'
  kernel_version:
    required: false
    type: string
    default: '6.12'
  sublevel:
    required: false
    type: string
    default: '30'
  os_patch_level:
    required: false
    type: string
    default: '2025-07'

runs:
  using: composite
  steps:
    - name: 'Apply Makefile fix for GLIBC >= 2.38'
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        GLIBC_VERSION="$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')"
        echo "[INFO] Detected GLIBC version: $GLIBC_VERSION"
        if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n 1)" = "2.38" ]; then
          echo "[INFO] GLIBC >= 2.38, checking Makefile fix."
          if [ -f tools/bpf/resolve_btfids/Makefile ]; then
            if grep -q '\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)' tools/bpf/resolve_btfids/Makefile; then
              echo "[INFO] Found pattern to fix, applying sed."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile
              MAKEFILE_FIXED="true"
            elif grep -q 'EXTRA_CFLAGS' tools/bpf/resolve_btfids/Makefile; then
              echo "[INFO] EXTRA_CFLAGS already present, no fix needed."
              MAKEFILE_FIXED="already_fixed"
            else
              MAKEFILE_FIXED="not_needed"
            fi
            echo "MAKEFILE_FIXED=$MAKEFILE_FIXED" >> $GITHUB_ENV
          fi
        fi

    - name: 'Sanitize /proc/config.gz Root & Stealth Configs'
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        MK="kernel/Makefile"
        if [ -f "$MK" ]; then
          if grep -q '^filechk_cat = cat \$<' "$MK"; then
            sed -i 's|^filechk_cat = cat \$<|filechk_cat = sed -E -e "/CONFIG_(KSU\|KPM\|NOMOUNT\|BBG)\|KernelSU\|SUSFS\|NoMount\|Baseband Guard/d" -e "s/,baseband_guard//g" $<|' "$MK"
            grep -q 'CONFIG_(KSU|KPM|NOMOUNT|BBG)' "$MK" || {
              echo "ERROR: Failed to patch filechk_cat in $MK" >&2
              exit 1
            }
            echo "[INFO] Patched kernel/Makefile: /proc/config.gz will omit root/stealth symbols (KSU/SUSFS/KPM/NoMount/BBG) while preserving DroidSpaces & NetHunter configs"
          elif grep -q 'CONFIG_(KSU|KPM|NOMOUNT|BBG)' "$MK"; then
            echo "[INFO] kernel/Makefile filechk_cat already sanitized for /proc/config.gz"
          else
            echo "[WARN] filechk_cat pattern not found in $MK; skipping /proc/config.gz sanitization"
          fi
        fi

    - name: 'Apply USB Gadget ConfigFS Multi-Gadget & USB Arsenal Patches'
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        echo "=== Applying USB Gadget ConfigFS Multi-Gadget Fix ==="
        python3 "${{ github.workspace }}/.github/scripts/patch_usb_gadget.py"

        echo "=== Applying USB Arsenal 6.12 Patches (PiKVM DVD-ROM >2.36GB ISO & HID bInterval) ==="
        for p in \
          "${{ github.workspace }}/.github/patches/usb-arsenal/0001-pikvm-msd-dvd-support.patch" \
          "${{ github.workspace }}/.github/patches/usb-arsenal/0002-usb-gadget-hid-add-a-writable-bInterval-configfs-att.patch"; do
          if [ -f "$p" ]; then
            name="$(basename "$p")"
            if patch -p1 --forward --dry-run -f < "$p" >/dev/null 2>&1; then
              patch -p1 --forward -f < "$p"
              echo "[INFO] Applied USB Arsenal patch: $name"
            else
              echo "[WARN] USB Arsenal patch already applied or skipped: $name"
            fi
          fi
        done

    - name: 'Enable Built-in USB Arsenal & HID Gadget Configs'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          # --- USB HID & BadUSB Gadgets (/dev/hidg*, /dev/uhid) ---
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_USB_HID=y
          CONFIG_UHID=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_F_HID=y

          # --- USB Arsenal Gadgets (ISO Mass Storage, Ethernet Tethering, Serial/ACM, Smartcard/Audio) ---
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_ANDROID_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_AC=y
          CONFIG_ANDROID_USB_CONFIGFS_F_ACC=y
          CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
          CONFIG_USB_CONFIGFS_F_CCID=y
          CONFIG_USB_CONFIGFS_F_UAC1=y

    - name: 'Final Kernel Fixes Summary'
      shell: bash
      run: |
        SUMMARY_FILE="/tmp/kernel-fixes-summary.md"
        echo "## Final Kernel Fixes Summary" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "**Kernel Version:** ${{ inputs.android_version }} + ${{ inputs.kernel_version }} (sublevel ${{ inputs.sublevel }})" >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"
        echo "### Fix Status" >> "$SUMMARY_FILE"
        echo "- Android 16 (6.12.30) compatibility validated" >> "$SUMMARY_FILE"
        echo "- /proc/config.gz root & stealth config sanitization enabled (preserves DroidSpaces & NetHunter configs)" >> "$SUMMARY_FILE"
        echo "- USB Gadget ConfigFS multi-gadget support patched" >> "$SUMMARY_FILE"
        echo "- USB Arsenal PiKVM DVD-ROM (>2.36GB ISO) & HID bInterval patches applied" >> "$SUMMARY_FILE"
