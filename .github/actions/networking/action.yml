name: 'Setup Networking'
description: 'Set up all networking options (IP Set, TCP CC, Qdisc, WireGuard, CIFS/SMB)'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  android_version:
    description: 'Android version (e.g., android16)'
    required: false
    default: 'android16'
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: '30'

runs:
  using: "composite"
  steps:
    - name: Enable IP Set & Firewall Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_IP6_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_MATCH_STRING=y
          CONFIG_NETFILTER_XT_MATCH_TIME=y
          CONFIG_NETFILTER_XT_MATCH_U32=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NETFILTER_XT_MATCH_QUOTA=y
          CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IPV6_OPTIMISTIC_DAD=y
          CONFIG_INET_DIAG_DESTROY=y

    - name: Enable TCP Congestion Control Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"

    - name: Enable Traffic Shaping (Qdisc) Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y

    - name: Enable Connection Marking Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NET_ACT_CONNMARK=y

    - name: Enable TTL/Hop Limit Target Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y

    - name: Enable WireGuard VPN Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_WIREGUARD=y

    - name: Enable CIFS / SMB Network Filesystem Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CIFS=y
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NETFS_SUPPORT=y
          CONFIG_KEYS=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y

    - name: Fix CIFS & netfs in modules.bzl on android16-6.12
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        for bzl in $(find . -name "modules.bzl" 2>/dev/null); do
          sed -i '/"fs\/netfs\/netfs\.ko",/d' "$bzl" 2>/dev/null || true
          sed -i '/"fs\/cifs\/cifs\.ko",/d' "$bzl" 2>/dev/null || true
        done
