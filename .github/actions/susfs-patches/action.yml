name: 'Apply SUSFS Patches'
description: 'Copy base SUSFS patches and apply version-specific fake patches'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  sublevel:
    description: 'Kernel sublevel'
    required: false
    default: '30'
  os_patch_level:
    description: 'OS patch level (e.g., 2025-07)'
    required: false
    default: '2025-07'

runs:
  using: "composite"
  steps:
    - name: Apply Kernel SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        # Apply base SUSFS patches
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/fs/"* "${{ github.workspace }}/kernel/common/fs/"
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/"* "${{ github.workspace }}/kernel/common/include/linux/"
        cp ${{ github.workspace }}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.version }}.patch ./

        # Fix 6.12 getname_flags argument mismatch in patch
        if [ -f "50_add_susfs_in_gki-${{ inputs.version }}.patch" ]; then
          sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/g' "50_add_susfs_in_gki-${{ inputs.version }}.patch"
        fi

        # Restore missing susfs_open_redirect_spoof_vfs_statfs definition if deleted upstream
        if [ -f fs/susfs.c ] && ! grep -q "susfs_open_redirect_spoof_vfs_statfs" fs/susfs.c; then
          echo "[INFO] Restoring susfs_open_redirect_spoof_vfs_statfs in fs/susfs.c..."
          cat << 'EOF' > /tmp/susfs_statfs_stub.c
        #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
        int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf) {
        	struct st_susfs_open_redirect_hlist *entry = NULL;
        	int srcu_idx = srcu_read_lock(&susfs_srcu_open_redirect);

        	hash_for_each_possible_rcu(OPEN_REDIRECT_HLIST, entry, node, inode->i_ino) {
        		if (entry->reversed_lookup_only &&
        			entry->target_dev == inode->i_sb->s_dev)
        		{
        			SUSFS_LOGI("spoof kstatfs for redirected path: '%s'\n",
        					entry->info.target_pathname);
        			memcpy(buf, &entry->spoofed_kstatfs, sizeof(struct kstatfs));
        			srcu_read_unlock(&susfs_srcu_open_redirect, srcu_idx);
        			return 0;
        		}
        	}
        	srcu_read_unlock(&susfs_srcu_open_redirect, srcu_idx);
        	return -EINVAL;
        }
        #else
        int susfs_open_redirect_spoof_vfs_statfs(struct inode *inode, struct kstatfs *buf) {
        	return -EINVAL;
        }
        #endif
        EOF
          sed -i 's/^[[:space:]]*//' /tmp/susfs_statfs_stub.c
          cat /tmp/susfs_statfs_stub.c >> fs/susfs.c
          rm -f /tmp/susfs_statfs_stub.c
        fi

    - name: Apply Android 16 6.12 Fake Patches
      shell: bash
      if: inputs.version == 'android16-6.12'
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        echo "Applying 6.12 SUSFS fixes"
        if [ "${{ inputs.sublevel }}" -ge "58" ]; then
          echo "Applying exec.c Android 16 6.12 Fake Patch"
          sed -i '/^#include <linux\/dma-buf.h>$/d' fs/exec.c
        fi
        if [ "${{ inputs.sublevel }}" -ge "69" ]; then
          echo "Applying task_mmu.c Android 16 6.12 Fake Patch"
          sed -i 's/vma_data_pages/vma_pages/g' fs/proc/task_mmu.c
        fi

    - name: Apply Kernel SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        patch -p1 < 50_add_susfs_in_gki-${{ inputs.version }}.patch

        # Extra safety check for getname_flags in fs/open.c
        if [ -f fs/open.c ]; then
          sed -i 's/getname_flags(filename, lookup_flags, NULL)/getname_flags(filename, lookup_flags)/g' fs/open.c
        fi

        # Fallback definition for VMA_PAD_START if not provided by kernel headers
        if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
          sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
        fi

        # Declare __fold_filemap_fixup_entry if referenced
        if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
          sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
          echo "Added page_size_compat.h include to fs/proc/task_mmu.c"
        fi
