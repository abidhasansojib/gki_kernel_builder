name: Setup Root Implementation (SukiSU-Ultra)
description: Download and configure SukiSU-Ultra root implementation with version tracking
inputs:
  flavor:
    description: 'Root flavor (default: SukiSU-Ultra)'
    required: false
    default: 'SukiSU-Ultra'
  ksu_branch:
    description: 'Branch or commit (empty = default)'
    required: false
    default: ""
  commit:
    description: 'Pinned commit SHA (used in verified mode)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download SukiSU-Ultra Root Implementation
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        FLAVOR="ultra"
        REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
        SETUP_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh"
        DEFAULT_REF="builtin"
        DIR_NAME="SukiSU-Ultra"
        MANAGER_NAME="SukiSU-Ultra Manager"

        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="$DEFAULT_REF"
        fi
        PINNED_COMMIT="${{ inputs.commit }}"

        echo "Root implementation: SukiSU-Ultra ($DIR_NAME)"
        echo "Target ref: $KSU_INPUT"
        if [ -n "$PINNED_COMMIT" ]; then
          echo "Target pinned commit: $PINNED_COMMIT"
        fi

        # Download via setup.sh or git clone
        if curl -fsSL "$SETUP_URL" &>/dev/null; then
          curl -LSs --retry 5 --retry-delay 5 --retry-all-errors "$SETUP_URL" | bash -s "$DEFAULT_REF" || true
        fi

        # Ensure directory is checked out properly
        TARGET_DIR=""
        if [ -d "$DIR_NAME" ]; then
          TARGET_DIR="$DIR_NAME"
        elif [ -d "KernelSU" ]; then
          TARGET_DIR="KernelSU"
        fi

        if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
          echo "Cloning $REPO into $DIR_NAME..."
          retry git clone "$REPO" "$DIR_NAME"
          TARGET_DIR="$DIR_NAME"
        fi

        # If a verified commit SHA was provided, check it out explicitly
        if [ -n "$PINNED_COMMIT" ] && [ -d "$TARGET_DIR" ]; then
          echo "Checking out verified pinned commit: $PINNED_COMMIT"
          cd "$TARGET_DIR"
          retry git fetch --depth=50 origin "$PINNED_COMMIT" 2>/dev/null || retry git fetch origin "$PINNED_COMMIT" 2>/dev/null || true
          git checkout "$PINNED_COMMIT" || {
            echo "ERROR: Failed to checkout pinned commit $PINNED_COMMIT" >&2
            exit 1
          }
          cd "${{ github.workspace }}/kernel"
        elif [ "$KSU_INPUT" != "$DEFAULT_REF" ] && [ -d "$TARGET_DIR" ]; then
          cd "$TARGET_DIR"
          if retry git ls-remote --heads "$REPO" "$KSU_INPUT" | grep -q .; then
            retry git fetch --depth=50 origin "$KSU_INPUT"
            git checkout "origin/$KSU_INPUT"
          else
            retry git fetch --depth=50 origin "$KSU_INPUT" || retry git fetch --depth=50 origin refs/tags/"$KSU_INPUT" || true
            git checkout "$KSU_INPUT" || true
          fi
          cd "${{ github.workspace }}/kernel"
        fi

        # Link to drivers if not already linked
        if [ -d common/drivers ]; then
          DRIVERS_DIR="common/drivers"
        elif [ -d drivers ]; then
          DRIVERS_DIR="drivers"
        fi

        if [ -n "${DRIVERS_DIR:-}" ]; then
          if [ ! -e "$DRIVERS_DIR/kernelsu" ] && [ ! -L "$DRIVERS_DIR/kernelsu" ]; then
            if [ -d "$TARGET_DIR/kernel" ]; then
              ln -s "$(realpath --relative-to="$DRIVERS_DIR" "$PWD/$TARGET_DIR/kernel")" "$DRIVERS_DIR/kernelsu"
            else
              ln -s "$(realpath --relative-to="$DRIVERS_DIR" "$PWD/$TARGET_DIR")" "$DRIVERS_DIR/kernelsu"
            fi
          fi
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$DRIVERS_DIR/Makefile" ||
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVERS_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig" ||
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"
        fi

        # Setup Kbuild version fallbacks if present
        KBUILD_PATH=""
        if [ -f "$TARGET_DIR/kernel/Kbuild" ]; then
          KBUILD_PATH="$TARGET_DIR/kernel/Kbuild"
          KDIR="$TARGET_DIR/kernel"
        elif [ -f "$TARGET_DIR/Kbuild" ]; then
          KBUILD_PATH="$TARGET_DIR/Kbuild"
          KDIR="$TARGET_DIR"
        fi

        if [ -n "$KBUILD_PATH" ] && [ -d "$KDIR" ]; then
          cd "$KDIR"
          BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's:-.*::' || echo "main")
          BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
          COMMITS_COUNT=$(git rev-list --count $BASE_COMMIT 2>/dev/null || echo "0")
          BASE_VERSION=30000
          KSU_VERSION=$((COMMITS_COUNT + BASE_VERSION))
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild 2>/dev/null || true

          KSU_GIT_TAG="$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "v0.0.1")"
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild 2>/dev/null || true
          cd "${{ github.workspace }}/kernel"
        fi

        echo "ROOT_IMPLEMENTATION=ultra" >> "$GITHUB_ENV"
        echo "ROOT_MANAGER=$MANAGER_NAME" >> "$GITHUB_ENV"

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        for candidate in SukiSU-Ultra KernelSU common/drivers/kernelsu drivers/kernelsu; do
          if [ -d "$candidate/.git" ] || [ -f "$candidate/.git" ]; then
            cd "$candidate"
            BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's:-.*::' || echo "main")
            BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
            KSU_GIT_VERSION=$(git rev-list --count $BASE_COMMIT 2>/dev/null || echo "0")
            KSU_GIT_TAG=$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "")
            KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
            echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
            echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
            echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
            echo "ROOT_VERSION=${KSU_GIT_TAG:-$KSU_COMMIT}" >> "$GITHUB_ENV"
            echo "ROOT_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
            break
          fi
        done

    - name: 'Fix KernelSU Static Patch'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        echo "[INFO] SukiSU-Ultra detected: native symbol linkage verified, checking selinux_hide.c..."

        for f in $(find . -name "selinux_hide.c" 2>/dev/null); do
          echo "Patching $f for extern linkage..."
          sed -i 's/^static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
          sed -i 's/^static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
          sed -i 's/^static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
          sed -i 's/^static void __nocfi security_compute_av_user_with_policy/void __nocfi security_compute_av_user_with_policy/g' "$f"
          sed -i 's/^static bool ksu_selinux_hide_running/bool ksu_selinux_hide_running/g' "$f"
          sed -i 's/^static bool ksu_selinux_hide_enabled/bool ksu_selinux_hide_enabled/g' "$f"
        done

    - name: 'Fix LSM Hook API for Linux 6.12+'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Linux 6.12+ changed security_add_hooks() third argument from
        # const char* to const struct lsm_id* -- patch lsm_hook.c if needed.

        # Find lsm_hook.c inside the KernelSU source tree
        LSM_HOOK_FILE=""
        for candidate in \
          SukiSU-Ultra/kernel/hook/lsm_hook.c \
          KernelSU/kernel/hook/lsm_hook.c \
          common/drivers/kernelsu/hook/lsm_hook.c \
          drivers/kernelsu/hook/lsm_hook.c; do
          if [ -f "$candidate" ]; then
            LSM_HOOK_FILE="$candidate"
            break
          fi
        done

        if [ -z "$LSM_HOOK_FILE" ]; then
          echo "[INFO] lsm_hook.c not found, skipping LSM API patch."
          exit 0
        fi

        # Detect whether the running kernel uses the new lsm_id API
        LSM_HOOKS_H=""
        for h in \
          common/include/linux/lsm_hooks.h \
          include/linux/lsm_hooks.h; do
          if [ -f "$h" ]; then
            LSM_HOOKS_H="$h"
            break
          fi
        done

        if [ -z "$LSM_HOOKS_H" ]; then
          echo "[WARN] lsm_hooks.h not found, skipping LSM API patch."
          exit 0
        fi

        if ! grep -q "const struct lsm_id \*" "$LSM_HOOKS_H"; then
          echo "[INFO] Kernel does not use lsm_id API, skipping patch."
          exit 0
        fi

        echo "[INFO] Linux 6.12+ lsm_id API detected, patching lsm_hook.c candidates..."
        for candidate in \
          SukiSU-Ultra/kernel/hook/lsm_hook.c \
          KernelSU/kernel/hook/lsm_hook.c \
          common/drivers/kernelsu/hook/lsm_hook.c \
          drivers/kernelsu/hook/lsm_hook.c; do
          if [ -f "$candidate" ]; then
            python3 "${{ github.workspace }}/.github/scripts/patch_lsm_hook.py" "$candidate"
          fi
        done

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
