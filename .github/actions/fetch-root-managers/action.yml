name: 'Fetch Root Manager APKs'
description: 'Download the single primary root manager APK for KernelSU-Next, SukiSU-Ultra, or ReSukiSU'
inputs:
  flavor:
    description: 'Root flavor (KernelSU-Next, SukiSU-Ultra, ReSukiSU, or All)'
    required: false
    default: 'KernelSU-Next'
  output_dir:
    description: 'Absolute path of directory to place downloaded APKs'
    required: false
    default: '${{ github.workspace }}/root-managers'
  token:
    description: 'GitHub token for API authentication'
    required: false
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Download Root Manager APKs
      shell: bash
      run: |
        set -euo pipefail

        FLAVOR="${{ inputs.flavor }}"
        OUT_DIR="${{ inputs.output_dir }}"
        GH_TOKEN="${{ inputs.token }}"

        mkdir -p "$OUT_DIR" /tmp/manager-dl
        cd /tmp/manager-dl

        fetch_single_primary_apk() {
          local owner="$1"
          local repo="$2"
          local flavor_tag="$3"

          echo "[+] Fetching primary release APK for ${owner}/${repo}..."
          local all_urls=""

          # 1. Try using GitHub CLI (gh api) with authentication
          if command -v gh >/dev/null 2>&1; then
            all_urls=$(gh api "repos/${owner}/${repo}/releases" --jq ".[0].assets[].browser_download_url" 2>/dev/null | grep -i "\.apk$" || true)
          fi

          # 2. Fallback to authenticated curl if gh returned empty
          if [ -z "$all_urls" ]; then
            local auth_header=()
            if [ -n "$GH_TOKEN" ]; then
              auth_header=(-H "Authorization: Bearer $GH_TOKEN")
            fi
            auth_header+=(-H "Accept: application/vnd.github+json" -H "User-Agent: curl/8.0")
            local rel_json
            rel_json=$(curl -fsSL --retry 5 --retry-delay 3 "${auth_header[@]}" \
              "https://api.github.com/repos/${owner}/${repo}/releases" 2>/dev/null || true)
            if [ -n "$rel_json" ]; then
              all_urls=$(echo "$rel_json" | grep -o '"browser_download_url": *"[^"]*\.apk"' | sed -e 's/"browser_download_url": *"//' -e 's/"$//' || true)
            fi
          fi

          if [ -z "$all_urls" ]; then
            echo "[-] Warning: Could not find APK release assets for ${owner}/${repo}"
            return 0
          fi

          # Select strictly ONE primary release APK:
          local chosen_url=""
          case "$flavor_tag" in
            *resukisu*)
              chosen_url=$(echo "$all_urls" | grep -v -i "debug" | grep -i "arm64" | head -n 1 || true)
              if [ -z "$chosen_url" ]; then
                chosen_url=$(echo "$all_urls" | grep -v -i "debug" | grep -i "universal" | head -n 1 || true)
              fi
              ;;
            *next*)
              chosen_url=$(echo "$all_urls" | grep -v -i "debug" | grep -v -i "spoofed" | head -n 1 || true)
              ;;
            *)
              chosen_url=$(echo "$all_urls" | grep -v -i "debug" | head -n 1 || true)
              ;;
          esac

          if [ -z "$chosen_url" ]; then
            chosen_url=$(echo "$all_urls" | head -n 1)
          fi

          if [ -n "$chosen_url" ]; then
            local fname="${chosen_url##*/}"
            echo "[+] Downloading primary APK: $fname"
            curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/manager-dl/${fname}" "$chosen_url"
            cp -f "/tmp/manager-dl/${fname}" "${OUT_DIR}/${fname}"
            echo "[✓] Saved single manager APK: ${OUT_DIR}/${fname}"
          fi
        }

        # Case matching: ReSukiSU MUST be checked before SukiSU-Ultra
        case "$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')" in
          *resukisu*)
            fetch_single_primary_apk "ReSukiSU" "ReSukiSU" "resukisu"
            ;;
          *ultra*|*sukisu*)
            fetch_single_primary_apk "SukiSU-Ultra" "SukiSU-Ultra" "sukisu-ultra"
            ;;
          *next*)
            fetch_single_primary_apk "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            ;;
          *all*)
            fetch_single_primary_apk "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            fetch_single_primary_apk "SukiSU-Ultra" "SukiSU-Ultra" "sukisu-ultra"
            fetch_single_primary_apk "ReSukiSU" "ReSukiSU" "resukisu"
            ;;
          *)
            fetch_single_primary_apk "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            ;;
        esac

        rm -rf /tmp/manager-dl

    - name: List Fetched Manager APKs
      shell: bash
      run: |
        echo "::group::Fetched Manager APKs"
        find "${{ inputs.output_dir }}" -maxdepth 2 -type f -name "*.apk" -ls 2>/dev/null || echo "No APK files found"
        echo "::endgroup::"
