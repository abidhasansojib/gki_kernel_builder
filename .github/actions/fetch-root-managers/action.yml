name: 'Fetch Root Manager APKs'
description: 'Download the matching root manager APKs for KernelSU-Next, SukiSU-Ultra, or ReSukiSU'
inputs:
  flavor:
    description: 'Root flavor (KernelSU-Next, SukiSU-Ultra, ReSukiSU, or All)'
    required: false
    default: 'KernelSU-Next'
  output_dir:
    description: 'Absolute path of directory to place downloaded APKs'
    required: false
    default: '${{ github.workspace }}/root-managers'
  token:
    description: 'GitHub token for API authentication'
    required: false
    default: '${{ github.token }}'

runs:
  using: composite
  steps:
    - name: Download Root Manager APKs
      shell: bash
      run: |
        set -euo pipefail

        FLAVOR="${{ inputs.flavor }}"
        OUT_DIR="${{ inputs.output_dir }}"
        GH_TOKEN="${{ inputs.token }}"

        mkdir -p "$OUT_DIR" /tmp/manager-dl
        cd /tmp/manager-dl

        fetch_repo_release_apks() {
          local owner="$1"
          local repo="$2"
          local prefix="$3"

          echo "[+] Fetching latest release APKs for ${owner}/${repo}..."
          local urls=""

          # 1. Try using GitHub CLI (gh api) with authentication
          if command -v gh >/dev/null 2>&1; then
            urls=$(gh api "repos/${owner}/${repo}/releases" --jq '.[0].assets[].browser_download_url' 2>/dev/null | grep "\.apk" | grep -v -i "debug" || true)
            if [ -z "$urls" ]; then
              urls=$(gh api "repos/${owner}/${repo}/releases" --jq '.[0].assets[].browser_download_url' 2>/dev/null | grep "\.apk" || true)
            fi
          fi

          # 2. Fallback to authenticated curl if gh returned empty
          if [ -z "$urls" ]; then
            local auth_header=()
            if [ -n "$GH_TOKEN" ]; then
              auth_header=(-H "Authorization: Bearer $GH_TOKEN")
            fi
            auth_header+=(-H "Accept: application/vnd.github+json" -H "User-Agent: curl/8.0")
            local rel_json
            rel_json=$(curl -fsSL --retry 5 --retry-delay 3 "${auth_header[@]}" \
              "https://api.github.com/repos/${owner}/${repo}/releases" 2>/dev/null || true)
            if [ -n "$rel_json" ]; then
              urls=$(echo "$rel_json" | grep -o '"browser_download_url": *"[^"]*\.apk"' | sed -e 's/"browser_download_url": *"//' -e 's/"$//' | grep -v -i "debug" || true)
              if [ -z "$urls" ]; then
                urls=$(echo "$rel_json" | grep -o '"browser_download_url": *"[^"]*\.apk"' | sed -e 's/"browser_download_url": *"//' -e 's/"$//' || true)
              fi
            fi
          fi

          if [ -n "$urls" ]; then
            for url in $urls; do
              local fname="${url##*/}"
              echo "Downloading: $fname from $url"
              curl -fsSL --retry 5 --retry-delay 3 -o "/tmp/manager-dl/${fname}" "$url"
              cp -f "/tmp/manager-dl/${fname}" "${OUT_DIR}/${fname}"
              echo "[✓] Saved ${OUT_DIR}/${fname}"
            done
          else
            echo "[-] Warning: Could not find APK release assets for ${owner}/${repo}"
          fi
        }

        # Match exact flavors: ReSukiSU MUST be checked before SukiSU-Ultra so *sukisu* does not match resukisu
        case "$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')" in
          *resukisu*)
            fetch_repo_release_apks "ReSukiSU" "ReSukiSU" "resukisu"
            ;;
          *ultra*|*sukisu*)
            fetch_repo_release_apks "SukiSU-Ultra" "SukiSU-Ultra" "sukisu-ultra"
            ;;
          *next*)
            fetch_repo_release_apks "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            ;;
          *all*)
            fetch_repo_release_apks "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            fetch_repo_release_apks "SukiSU-Ultra" "SukiSU-Ultra" "sukisu-ultra"
            fetch_repo_release_apks "ReSukiSU" "ReSukiSU" "resukisu"
            ;;
          *)
            fetch_repo_release_apks "KernelSU-Next" "KernelSU-Next" "kernelsu-next"
            ;;
        esac

        rm -rf /tmp/manager-dl

    - name: List Fetched Manager APKs
      shell: bash
      run: |
        echo "::group::Fetched Manager APKs"
        find "${{ inputs.output_dir }}" -maxdepth 2 -type f -name "*.apk" -ls 2>/dev/null || echo "No APK files found"
        echo "::endgroup::"
