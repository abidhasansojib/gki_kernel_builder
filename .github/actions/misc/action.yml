name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android16-6.12)'
    required: false
    default: 'android16-6.12'
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: false
    default: '6.12'
  android_version:
    description: 'Android version (e.g., android16)'
    required: false
    default: 'android16'
  sublevel:
    description: 'Sublevel of kernel version (e.g., 30)'
    required: false
    default: '30'
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: false
    default: 'Normal'

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_BPF_EVENTS=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_UPROBES=y
          CONFIG_UPROBE_EVENTS=y
          CONFIG_FUSE_BPF=y