name: Fetch Root Managers

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:

jobs:
  fetch-managers:
    name: "Fetch SukiSU-Ultra Manager APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Fetch SukiSU-Ultra Manager APK
        uses: ./.github/actions/fetch-root-managers
        with:
          flavor: SukiSU-Ultra
          output_dir: ${{ github.workspace }}/root-managers

      - name: Upload Manager APKs
        uses: actions/upload-artifact@v7
        with:
          name: Root-Manager-APKs
          path: ${{ github.workspace }}/root-managers/
          if-no-files-found: warn
          compression-level: 0
