name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      root_flavor:
        description: "Root Flavor"
        type: choice
        options:
          - KernelSU-Next
          - ReSukiSU
        default: KernelSU-Next
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - FULL
          - WITHOUT-NETHUNTER
          - NONE
        default: FULL
      ksu_branch:
        description: "KernelSU branch or commit (empty = default for selected flavor)"
        type: string
        required: false
        default: ""
      susfs_commit_android16-6-12:
        description: "SUSFS commit for android16-6.12 (empty = latest branch tip)"
        type: string
        required: false
        default: ""

jobs:
  resolve-nomount:
    name: "Resolve NoMount Commit"
    if: ${{ inputs.feature_set != 'NONE' }}
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
    steps:
      - name: Resolve latest NoMount dev commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1}')"
          if [ -z "$sha" ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to resolve NoMount dev branch tip." >&2
            exit 1
          fi
          echo "nomount_commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved NoMount dev commit: $sha"

  build-nomount-module:
    name: "Build NoMount Metamodule"
    needs: [resolve-nomount]
    if: ${{ inputs.feature_set != 'NONE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build NoMount metamodule
        id: nomount-metamodule
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}

      - name: Upload NoMount metamodule
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.nomount-metamodule.outputs.module_path }}
          if-no-files-found: error
          compression-level: 0

  build-kernel:
    name: "Build Kernel (6.12.30-android16)"
    needs: [resolve-nomount]
    if: ${{ always() && (needs.resolve-nomount.result == 'success' || needs.resolve-nomount.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: "android16-6.12"
      ANDROID_VERSION: "android16"
      KERNEL_VERSION: "6.12"
      SUBLEVEL: "30"
      OS_PATCH_LEVEL: "2025-07"
      VARIANT: "Normal"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: "android16-6.12"
          sublevel: "30"
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Build FUSE-BPF Userspace Daemon
        continue-on-error: true
        uses: ./.github/actions/fuse-bpf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          FIXED_BUILD_DATE="2025-07-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: "30"
          os_patch_level: "2025-07"
          variant: "Normal"

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: "2025-07"

      - name: Setup Root Implementation
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/kernelsu
        with:
          flavor: ${{ inputs.root_flavor }}
          ksu_branch: ${{ inputs.ksu_branch }}

      - name: SUSFS
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ inputs.susfs_commit_android16-6-12 }}
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: "2025-07"
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}
          nomount_enabled: ${{ inputs.feature_set != 'NONE' }}

      - name: Fix selinux_hide static declarations & pointer-bool-conversion on 6.12
        if: ${{ inputs.feature_set != 'NONE' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find "${{ github.workspace }}/kernel" -name selinux_hide.c 2>/dev/null); do
            echo "[INFO] Fixing extern symbol linkage and Clang warnings in $f..."
            sed -i 's/^static \(.*security_context_to_sid_with_policy\)/\1/g' "$f"
            sed -i 's/^static \(.*security_sid_to_context_with_policy\)/\1/g' "$f"
            sed -i 's/^static \(.*security_compute_av_user_with_policy\)/\1/g' "$f"
            sed -i 's/static void __nocfi security_compute_av_user_with_policy/void __nocfi security_compute_av_user_with_policy/g' "$f"
            sed -i 's/static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
            sed -i 's/static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
            sed -i 's/static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
            if grep -q "extern void security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is extern-function form, patching with &"
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
            elif grep -q "if (security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is pointer form, patching with != NULL"
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
            fi
          done

      - name: Baseband Guard
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/networking
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Setup NetHunter & Wireless Drivers
        if: ${{ inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/nethunter
        with:
          version: "android16-6.12"

      - name: DroidSpaces-OSS Patches
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/droidspaces
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Apply NTSync Patches
        uses: ./.github/actions/ntsync
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.12"

      - name: Apply Unicode Fix Patch
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.12"

      - name: Setup Misc Configs
        uses: ./.github/actions/misc

      - name: Enable BTF
        uses: ./.github/actions/btf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Integrate NoMount
        if: ${{ inputs.feature_set != 'NONE' }}
        uses: ./.github/actions/nomount
        with:
          commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}
          kernel_version: "6.12"

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: "Normal"
          kernel_version: "6.12"
          android_version: "android16"
          version: "android16-6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: ${{ always() }}
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: 'Setup Cache and Build Environment'
        uses: ./.github/actions/cache-setup
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/gki.fragment"

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: "android16-6.12"
          bypass: false

      - name: Build Bypass Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          bypass: true
          version: "android16-6.12"

      - name: 📦 Build NetHunter Wireless Module
        if: ${{ inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/nethunter-module
        with:
          file_name: ${{ steps.extract.outputs.file_name }}

      - name: 📋 Generate Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_BASE="${{ steps.extract.outputs.file_name }}"
          if [ -z "${SUMMARY_BASE}" ]; then
            SUMMARY_BASE="6.12.30-android16-2025-07"
          fi
          SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
          echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          KERNEL_VER_STR=""
          if [ -f "${{ github.workspace }}/AnyKernel3/Image" ]; then
            KERNEL_VER_STR=$(strings "${{ github.workspace }}/AnyKernel3/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
          fi

          KSU_VER="${KSU_VERSION:-N/A}"
          KSU_TAG="${KSU_GIT_TAG:-N/A}"
          ROOT_IMPL="${ROOT_IMPLEMENTATION:-${{ inputs.root_flavor }}}"
          ROOT_MANAGER="${ROOT_MANAGER:-${ROOT_IMPL} Manager}"
          ROOT_VERSION="${KSU_TAG}"
          ROOT_SHA="${KSU_COMMIT:-N/A}"
          NOMOUNT_SHA="${{ needs.resolve-nomount.outputs.nomount_commit || 'N/A' }}"
          SUSFS_SHA="${SUSFS_COMMIT:-N/A}"

          SUSFS_VER="N/A"
          if [ -f "${{ github.workspace }}/kernel/common/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep '#define SUSFS_VERSION' "${{ github.workspace }}/kernel/common/include/linux/susfs.h" | awk -F'"' '{print $2}' || echo "N/A")
          fi

          {
            echo "## android16 6.12.30 (Normal) — ${STATUS}"
            echo
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Status** | ${STATUS} |"
            echo "| **Kernel** | 6.12.30-android16-2025-07 |"
            if [ -n "$KERNEL_VER_STR" ]; then
              echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
            fi
            echo "| **KSU Version** | ${KSU_VER} |"
            echo "| **KSU Tag** | ${KSU_TAG} |"
            echo "| **Root Implementation** | ${ROOT_IMPL} |"
            echo "| **Root Manager** | ${ROOT_MANAGER} |"
            echo "| **Root Version** | ${ROOT_VERSION} |"
            echo "| **Root Commit** | ${ROOT_SHA} |"
            echo "| **SUSFS Version** | ${SUSFS_VER} |"
            echo "| **SUSFS Commit** | ${SUSFS_SHA} |"
            echo "| **NoMount Commit** | ${NOMOUNT_SHA} |"
            echo "| **Feature Set** | ${{ inputs.feature_set }} |"
            echo "| **Variant** | Normal |"
            echo

            if [ -f /tmp/kernel-fixes-summary.md ]; then
              echo "### 🔧 Kernel Fixes"
              cat /tmp/kernel-fixes-summary.md
              echo
            fi
          } > "$SUMMARY_FILE"

      - name: Upload Build Summary Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_BASE }}-Summary
          path: /tmp/build-summary-${{ env.SUMMARY_BASE }}.md
          if-no-files-found: ignore
          compression-level: 9

      - name: 📦 Package AnyKernel3 Flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="${{ steps.extract.outputs.file_name }}-AnyKernel3.zip"
          cd "${{ github.workspace }}/AnyKernel3"
          rm -rf .git .github .gitignore
          zip -r -q -9 "${{ github.workspace }}/${ZIP_NAME}" . -x ".git*" -x "*/.git*"
          echo "Successfully created flashable ZIP: ${ZIP_NAME}"
          ls -lh "${{ github.workspace }}/${ZIP_NAME}"

      - name: Upload AnyKernel3 ZIP Artifact
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-AnyKernel3.zip
          if-no-files-found: error
          compression-level: 0

  summary:
    name: "Consolidated Build Summary"
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build-kernel]
    steps:
      - name: 📥 Download Build Summaries
        uses: actions/download-artifact@v7
        with:
          path: ./summaries
          pattern: "*-Summary"
          merge-multiple: true

      - name: 📋 Merge Summaries
        run: |
          {
            echo "# 📋 Consolidated Build Summary"
            echo
            for f in ./summaries/*.md; do
              if [ -f "$f" ]; then
                cat "$f"
                echo
                echo "---"
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: "Publish Release"
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') && (needs.build-kernel.result == 'success') }}
    permissions:
      contents: write
    needs:
      - build-kernel
      - summary
      - build-nomount-module

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: .github/config/RELEASE_NOTES.md
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate New Tag
        id: tag
        if: inputs.release_type != 'Action'
        run: |
          mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)

          LATEST_REV=0
          for TAG in "${RELEASE_TAGS[@]}"; do
            REV="${TAG#r}"
            if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
              LATEST_REV="$REV"
            fi
          done

          if [[ "$LATEST_REV" -gt 0 ]]; then
            NEW_TAG="r$((LATEST_REV + 1))"
          else
            NEW_TAG="r1"
          fi

          if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
            echo "Latest r-tag: r${LATEST_REV}"
          else
            echo "No existing r-tags found; starting at r1"
          fi
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Set Release Title
        id: release_meta
        run: |
          set -euo pipefail

          if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
            REV_NUM="${BASH_REMATCH[1]}"
            release_title="Release ${REV_NUM}"
          else
            release_title="Release ${NEW_TAG}"
          fi

          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

      - name: Extract Root Implementation Version Info
        id: ksu_version
        run: |
          set -euo pipefail

          if [ "${{ inputs.feature_set }}" = "NONE" ]; then
            echo "Building vanilla stock GKI release (no root)."
            echo "ROOT_IMPL=None (Vanilla Stock GKI)" >> "$GITHUB_ENV"
            echo "ROOT_MANAGER_NAME=None" >> "$GITHUB_ENV"
            echo "KSUN_BRANCH=N/A" >> "$GITHUB_ENV"
            echo "KSUN_COMMIT=N/A" >> "$GITHUB_ENV"
            echo "KSU_COMMITS_COUNT=0" >> "$GITHUB_ENV"
            echo "KSU_VERSION=N/A" >> "$GITHUB_ENV"
            echo "KSU_GIT_TAG=N/A" >> "$GITHUB_ENV"
            echo "KSU_MANAGER=N/A" >> "$GITHUB_ENV"
            exit 0
          fi

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          RAW_FLAVOR="${{ inputs.root_flavor }}"
          case "$(echo "$RAW_FLAVOR" | tr '[:upper:]' '[:lower:]')" in
            *resukisu*)
              FLAVOR_NAME="ReSukiSU"
              KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
              OFFICIAL_KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
              DEFAULT_REF="main"
              OFFICIAL_SYNC_BRANCH="main"
              MANAGER_WORKFLOW="build-manager.yml"
              MANAGER_REPO="ReSukiSU/ReSukiSU"
              ;;
            *next*|*)
              FLAVOR_NAME="KernelSU-Next"
              KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
              OFFICIAL_KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
              DEFAULT_REF="dev-susfs"
              OFFICIAL_SYNC_BRANCH="dev"
              MANAGER_WORKFLOW="build-manager-ci.yml"
              MANAGER_REPO="KernelSU-Next/KernelSU-Next"
              ;;
          esac

          KSU_INPUT="${{ inputs.ksu_branch }}"
          if [ -z "$KSU_INPUT" ]; then
            KSU_INPUT="$DEFAULT_REF"
          fi

          echo "Resolving root flavor: $FLAVOR_NAME ($KSU_REPO)"
          echo "Target ref: $KSU_INPUT"

          if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
            echo "Cloning $FLAVOR_NAME from branch: $KSU_INPUT"
            git clone --branch "$KSU_INPUT" "$KSU_REPO" /tmp/kernelsu-repo
            cd /tmp/kernelsu-repo
            KSUN_COMMIT=$(git rev-parse HEAD)
          else
            echo "Cloning $FLAVOR_NAME from default branch $DEFAULT_REF, checking out commit: $KSU_INPUT"
            git clone --branch "$DEFAULT_REF" "$KSU_REPO" /tmp/kernelsu-repo
            cd /tmp/kernelsu-repo
            git fetch --depth=50 origin "$KSU_INPUT" || true
            git checkout "$KSU_INPUT" || true
            KSUN_COMMIT="$KSU_INPUT"
          fi

          retry git fetch "$OFFICIAL_KSU_REPO" "$OFFICIAL_SYNC_BRANCH"
          STOCK_COMMIT=$(git merge-base HEAD FETCH_HEAD 2>/dev/null || git rev-parse HEAD)
          echo "Root stock commit (official sync point): $STOCK_COMMIT"

          COMMITS_COUNT=$(git rev-list --count "$STOCK_COMMIT" 2>/dev/null || echo "0")
          BASE_VERSION=30000
          KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)

          KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$STOCK_COMMIT" 2>/dev/null || echo "no-tag")

          MANAGER_RUN_ID=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${MANAGER_REPO}/actions/workflows/${MANAGER_WORKFLOW}/runs?head_sha=${STOCK_COMMIT}" | jq -r '.workflow_runs[0].id // empty' 2>/dev/null || echo "")
          if [[ -n "${MANAGER_RUN_ID:-}" ]]; then
            KSU_MANAGER="https://github.com/${MANAGER_REPO}/actions/runs/${MANAGER_RUN_ID}"
          else
            KSU_MANAGER="https://github.com/${MANAGER_REPO}/releases"
          fi

          echo "Commits count: $COMMITS_COUNT"
          echo "KSU Version: $KSU_VERSION"
          echo "KSU Git Tag: $KSU_GIT_TAG"
          echo "KSU Manager: $KSU_MANAGER"

          echo "ROOT_IMPL=$FLAVOR_NAME" >> "$GITHUB_ENV"
          echo "ROOT_MANAGER_NAME=${FLAVOR_NAME} Manager" >> "$GITHUB_ENV"
          echo "KSUN_BRANCH=$KSU_INPUT" >> "$GITHUB_ENV"
          echo "KSUN_COMMIT=$KSUN_COMMIT" >> "$GITHUB_ENV"
          echo "KSU_COMMITS_COUNT=$COMMITS_COUNT" >> "$GITHUB_ENV"
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
          echo "KSU_MANAGER=$KSU_MANAGER" >> "$GITHUB_ENV"

      - name: Set release body
        run: |
          set -e

          # Generate dynamic commit changelog
          export CHANGELOG="$(git log -n 15 --pretty=format:'* %h - %s (%cr)' 2>/dev/null || echo '* Initial automated build release')"

          RELEASE_NOTES_PATH="$RELEASE_NOTES"
          : > release_body.md

          python3 .github/scripts/render_release_body.py "$RELEASE_NOTES_PATH" > release_body.md

      - name: Publish release notes preview
        run: |
          {
            echo "## Release Notes Preview"
            echo
            cat release_body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📥 Download All Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: raw-artifacts

      - name: 📦 Prepare and Package All Artifacts for Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          echo "=== Processing all downloaded artifacts ==="
          for item in raw-artifacts/*; do
            [ -e "$item" ] || continue
            base_name="$(basename "$item")"

            # Skip internal summaries if any remain
            if [[ "$base_name" == *"-Summary" ]]; then
              continue
            fi

            if [ -d "$item" ]; then
              # Check if directory contains exactly one zip file
              zip_count=$(find "$item" -maxdepth 1 -type f -name "*.zip" | wc -l)
              file_count=$(find "$item" -maxdepth 1 -type f | wc -l)
              dir_count=$(find "$item" -mindepth 1 -maxdepth 1 -type d | wc -l)

              if [ "$zip_count" -eq 1 ] && [ "$file_count" -eq 1 ] && [ "$dir_count" -eq 0 ]; then
                # Move the single zip out directly
                single_zip=$(find "$item" -maxdepth 1 -type f -name "*.zip")
                mv -fv "$single_zip" release-assets/
              else
                # Directory contains multiple files/subdirs or non-zip files -> zip the whole directory
                echo "Zipping folder: $base_name into release-assets/${base_name}.zip"
                (cd "$item" && zip -r -q -9 "${GITHUB_WORKSPACE}/release-assets/${base_name}.zip" .)
              fi
            elif [ -f "$item" ]; then
              mv -fv "$item" release-assets/
            fi
          done

          echo "=== All Assets Ready for Release ==="
          ls -lh release-assets/

      - name: 🚀 Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: release-assets/*
