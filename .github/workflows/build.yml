name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      commit_mode:
        description: "latest = branch tips, verified = audited pins, update = build latest then promote verified pins on success"
        required: false
        type: choice
        options:
          - verified
          - latest
          - update
        default: verified
      root_flavor:
        description: "Root Flavor"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra
          - ReSukiSU
          - All
        default: KernelSU-Next
      ksu_branch:
        description: "Custom Branch / Tag for Root Flavor (empty = default)"
        type: string
        required: false
        default: ""
      use_nomount:
        description: "NoMount"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      use_net:
        description: "Networking"
        type: boolean
        default: true
      use_droidspaces:
        description: "DroidSpaces"
        type: boolean
        default: true
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: true
      use_ptrace:
        description: "Ptrace Patch"
        type: boolean
        default: true
      use_unicode:
        description: "Unicode Fix"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      use_perf:
        description: "Performance"
        type: boolean
        default: true
      use_nethunter:
        description: "Kali NetHunter"
        type: boolean
        default: true
      use_cifs:
        description: "CIFS"
        type: boolean
        default: true
      use_cache:
        description: "Use ccache/bazel cache (restore/save)"
        type: boolean
        default: true

jobs:
  resolve-sources:
    name: "Resolve Component Commits"
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      susfs_commit: ${{ steps.resolve.outputs.susfs_commit }}
      root_matrix: ${{ steps.resolve.outputs.root_matrix }}
      ksun_commit: ${{ steps.resolve.outputs.ksun_commit }}
      ultra_commit: ${{ steps.resolve.outputs.ultra_commit }}
      resukisu_commit: ${{ steps.resolve.outputs.resukisu_commit }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve commits per commit_mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MODE="${{ inputs.commit_mode }}"
          echo "Commit Mode: $COMMIT_MODE"

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          resolve_sha() {
            retry git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          emit() {
            if [ -z "$2" ] || ! [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve $1 (got: ${2:-empty})" >&2
              exit 1
            fi
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            echo "  $1=$2"
          }

          # Read verified pins from config
          COMMITS_FILE=".github/config/commits.json"
          PIN_NOMOUNT=$(jq -r '.nomount.dev // empty' "$COMMITS_FILE" 2>/dev/null || echo "9a1431782f390453de54610fb91bdad03eab5b43")
          PIN_SUSFS=$(jq -r '."susfs"."gki-android16-6.12" // empty' "$COMMITS_FILE" 2>/dev/null || echo "7d91da2d2ce056d1abf378d9199aaf1072d37ab0")
          PIN_KSUN=$(jq -r '."kernelsu_next"."dev-susfs" // empty' "$COMMITS_FILE" 2>/dev/null || echo "5a4a71874caaad06aa126f761c93391de1d32361")
          PIN_ULTRA=$(jq -r '."sukisu_ultra"."main" // empty' "$COMMITS_FILE" 2>/dev/null || echo "d160166668ce7565d3ec85a210f9e9cf2996ca65")
          PIN_RESUKISU=$(jq -r '."resukisu"."main" // empty' "$COMMITS_FILE" 2>/dev/null || echo "0b5efe9e0102c43ca5c41174d500f5a7080cd0c7")

          pick() {
            local pinned="$1" repo="$2" ref="$3"
            if [ "$COMMIT_MODE" = "verified" ] && [ -n "$pinned" ]; then
              echo "$pinned"
            else
              resolve_sha "$repo" "$ref"
            fi
          }

          echo "Resolving dependencies..."
          emit nomount_commit "$(pick "$PIN_NOMOUNT" https://github.com/maxsteeel/nomount.git refs/heads/dev)"
          emit susfs_commit "$(pick "$PIN_SUSFS" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android16-6.12)"
          emit ksun_commit "$(pick "$PIN_KSUN" https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs)"
          emit ultra_commit "$(pick "$PIN_ULTRA" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main)"
          emit resukisu_commit "$(pick "$PIN_RESUKISU" https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main)"

          KSUN_SHA="$(pick "$PIN_KSUN" https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs)"
          ULTRA_SHA="$(pick "$PIN_ULTRA" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main)"
          RESUKISU_SHA="$(pick "$PIN_RESUKISU" https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main)"

          mk_entry() {
            printf '{"flavor":"%s","ref":"%s","commit":"%s"}' "$1" "$2" "$3"
          }

          ROOT="${{ inputs.root_flavor }}"
          CUSTOM_REF="${{ inputs.ksu_branch }}"

          case "$ROOT" in
            All)
              ROOT_MATRIX="[$(mk_entry KernelSU-Next dev-susfs "$KSUN_SHA"),$(mk_entry SukiSU-Ultra main "$ULTRA_SHA"),$(mk_entry ReSukiSU main "$RESUKISU_SHA")]"
              ;;
            SukiSU-Ultra)
              REF="${CUSTOM_REF:-main}"
              ROOT_MATRIX="[$(mk_entry SukiSU-Ultra "$REF" "$ULTRA_SHA")]"
              ;;
            ReSukiSU)
              REF="${CUSTOM_REF:-main}"
              ROOT_MATRIX="[$(mk_entry ReSukiSU "$REF" "$RESUKISU_SHA")]"
              ;;
            KernelSU-Next)
              REF="${CUSTOM_REF:-dev-susfs}"
              ROOT_MATRIX="[$(mk_entry KernelSU-Next "$REF" "$KSUN_SHA")]"
              ;;
            *)
              ROOT_MATRIX="[$(mk_entry KernelSU-Next dev-susfs "$KSUN_SHA")]"
              ;;
          esac

          echo "root_matrix=$ROOT_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Generated Root Matrix: $ROOT_MATRIX"

  build-nomount-module:
    name: "Build NoMount Metamodule"
    needs: [resolve-sources]
    if: ${{ inputs.use_nomount }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build NoMount metamodule
        id: nomount-metamodule
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ needs.resolve-sources.outputs.nomount_commit }}

      - name: Upload NoMount metamodule
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.nomount-metamodule.outputs.module_path }}
          if-no-files-found: error
          compression-level: 0

  build-kernel:
    name: "Build Kernel (${{ matrix.flavor }})"
    needs: [resolve-sources]
    if: ${{ always() && (needs.resolve-sources.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-sources.outputs.root_matrix) }}
    env:
      VERSION: "android16-6.12"
      ANDROID_VERSION: "android16"
      KERNEL_VERSION: "6.12"
      SUBLEVEL: "30"
      OS_PATCH_LEVEL: "2025-07"
      VARIANT: "Normal"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free Disk Space
        uses: ./.github/actions/disk-cleanup

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: "android16-6.12"
          sublevel: "30"
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: "2025-07"

      - name: Build FUSE-BPF Userspace Daemon
        if: ${{ inputs.use_bpf }}
        continue-on-error: true
        uses: ./.github/actions/fuse-bpf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          FIXED_BUILD_DATE="2025-07-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: "30"
          os_patch_level: "2025-07"
          variant: "Normal"

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: "2025-07"

      - name: Setup Root Implementation
        uses: ./.github/actions/kernelsu
        with:
          flavor: ${{ matrix.flavor }}
          ksu_branch: ${{ matrix.ref }}

      - name: SUSFS
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ needs.resolve-sources.outputs.susfs_commit }}
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          os_patch_level: "2025-07"
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ matrix.flavor }}
          nomount_enabled: ${{ inputs.use_nomount }}

      - name: Fix selinux_hide static declarations & pointer-bool-conversion on 6.12
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find "${{ github.workspace }}/kernel" -name selinux_hide.c 2>/dev/null); do
            echo "[INFO] Fixing extern symbol linkage and Clang warnings in $f..."
            sed -i -E 's/\bstatic\b[[:space:]]+(int|void)/\1/g' "$f"
            if grep -q "extern void security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is extern-function form, patching with &"
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
            elif grep -q "if (security_dump_masked_av_fn" "$f"; then
              echo "[INFO] $f is pointer form, patching with != NULL"
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
            fi
          done

      - name: Baseband Guard
        if: ${{ inputs.use_bbg }}
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: ${{ inputs.use_net }}
        uses: ./.github/actions/networking
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          android_version: "android16"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Setup NetHunter & Wireless Drivers
        if: ${{ inputs.use_nethunter }}
        uses: ./.github/actions/nethunter
        with:
          version: "android16-6.12"

      - name: DroidSpaces-OSS Patches
        if: ${{ inputs.use_droidspaces }}
        uses: ./.github/actions/droidspaces
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Apply NTSync Patches
        if: ${{ inputs.use_ntsync }}
        uses: ./.github/actions/ntsync
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: ${{ inputs.use_ptrace }}
        uses: ./.github/actions/ptrace
        with:
          kernel_version: "6.12"

      - name: Apply Unicode Fix Patch
        if: ${{ inputs.use_unicode }}
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: "6.12"

      - name: Apply Performance Patches
        if: ${{ inputs.use_perf }}
        uses: ./.github/actions/performance
        with:
          kernel_version: "6.12"

      - name: Setup CIFS
        if: ${{ inputs.use_cifs }}
        uses: ./.github/actions/cifs

      - name: Setup Misc Configs
        uses: ./.github/actions/misc

      - name: Enable BTF
        if: ${{ inputs.use_bpf }}
        uses: ./.github/actions/btf
        with:
          version: "android16-6.12"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: "android16-6.12"
          kernel_version: "6.12"

      - name: Integrate NoMount
        if: ${{ inputs.use_nomount }}
        uses: ./.github/actions/nomount
        with:
          commit: ${{ needs.resolve-sources.outputs.nomount_commit }}
          kernel_version: "6.12"

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: "Normal"
          kernel_version: "6.12"
          android_version: "android16"
          version: "android16-6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: ${{ always() }}
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: 'Setup Cache and Build Environment'
        if: ${{ inputs.use_cache }}
        uses: ./.github/actions/cache-setup
        with:
          version: "android16-6.12"
          android_version: "android16"
          kernel_version: "6.12"
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/gki.fragment"

      - name: Build Kernel (with Vendor Module Bypass)
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: "android16-6.12"

      - name: 📦 Build NetHunter Wireless Module
        if: ${{ inputs.use_nethunter }}
        uses: ./.github/actions/nethunter-module
        with:
          file_name: ${{ steps.extract.outputs.file_name }}

      - name: 📱 Fetch Matching Root Manager APK
        uses: ./.github/actions/fetch-root-managers
        with:
          flavor: ${{ matrix.flavor }}
          output_dir: ${{ github.workspace }}/root-managers

      - name: Upload Root Manager APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Manager
          path: ${{ github.workspace }}/root-managers/
          if-no-files-found: warn
          compression-level: 0

      - name: 📋 Generate Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_BASE="${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}"
          SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
          echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="[+] Success"
          else
            STATUS="[-] Failed"
          fi

          cat << 'EOF' > "$SUMMARY_FILE"
          # GKI Kernel Build Summary

          ## Status: __STATUS__
          - **Kernel Version:** 6.12.30-android16
          - **OS Patch Level:** 2025-07
          - **Root Flavor:** __ROOT_FLAVOR__
          - **Vendor Bypass:** Baked In (Default)
          - **Commit Mode:** __COMMIT_MODE__
          - **NoMount Metamodule:** __NOMOUNT_STATUS__
          - **NetHunter Module:** __NETHUNTER_STATUS__
          - **Performance Patches:** __PERF_STATUS__
          - **BPF Stack:** __BPF_STATUS__
          EOF
          sed -i 's/^[[:space:]]*//' "$SUMMARY_FILE"

          sed -i "s/__STATUS__/${STATUS}/g" "$SUMMARY_FILE"
          sed -i "s/__ROOT_FLAVOR__/${{ matrix.flavor }}/g" "$SUMMARY_FILE"
          sed -i "s/__COMMIT_MODE__/${{ inputs.commit_mode }}/g" "$SUMMARY_FILE"
          sed -i "s/__NOMOUNT_STATUS__/${{ inputs.use_nomount }}/g" "$SUMMARY_FILE"
          sed -i "s/__NETHUNTER_STATUS__/${{ inputs.use_nethunter }}/g" "$SUMMARY_FILE"
          sed -i "s/__PERF_STATUS__/${{ inputs.use_perf }}/g" "$SUMMARY_FILE"
          sed -i "s/__BPF_STATUS__/${{ inputs.use_bpf }}/g" "$SUMMARY_FILE"

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Summary Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_BASE }}-Summary
          path: /tmp/build-summary-*.md
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload AnyKernel3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-AnyKernel3
          path: AnyKernel3/
          if-no-files-found: error
          compression-level: 9

      - name: Package NoMount Module
        if: ${{ inputs.use_nomount }}
        shell: bash
        run: |
          set -euo pipefail
          NOMOUNT_DIR="${{ github.workspace }}/nomount-dist"
          mkdir -p "$NOMOUNT_DIR"
          if [ -d "${{ github.workspace }}/AnyKernel3/tools" ]; then
            cp -f ${{ github.workspace }}/AnyKernel3/tools/ak3-core.sh "$NOMOUNT_DIR/" 2>/dev/null || true
          fi
          cd "${{ github.workspace }}/nomount" 2>/dev/null || cd "${{ github.workspace }}"
          zip -r9 "$NOMOUNT_DIR/NoMount-${{ steps.extract.outputs.file_name }}.zip" . -x "*.git*" "out/*" 2>/dev/null || true

      - name: Upload NoMount Module Artifact
        if: ${{ inputs.use_nomount }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-NoMount
          path: ${{ github.workspace }}/nomount-dist/
          if-no-files-found: ignore
          compression-level: 0

      - name: 📦 Package Root-Flavor Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="/tmp/bundle-${{ matrix.flavor }}"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"

          # 1. Package AnyKernel3 Zip
          echo "[+] Adding AnyKernel3 zip to flavor bundle..."
          (cd "${{ github.workspace }}/AnyKernel3" && zip -r9 "$BUNDLE_DIR/${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-AnyKernel3.zip" . -x "*.git*")

          # 2. Add Matching Root Manager APK
          if [ -d "${{ github.workspace }}/root-managers" ]; then
            echo "[+] Adding matching Root Manager APKs..."
            cp -f "${{ github.workspace }}/root-managers/"*.apk "$BUNDLE_DIR/" 2>/dev/null || true
          fi

          # 3. Add NetHunter Wireless Module (if enabled)
          if [ -f "${{ github.workspace }}/Nethunter-Wireless-Modules.zip" ]; then
            echo "[+] Adding NetHunter Wireless Module..."
            cp -f "${{ github.workspace }}/Nethunter-Wireless-Modules.zip" "$BUNDLE_DIR/"
          fi

          # 4. Add NoMount Metamodule (if enabled)
          if [ -d "${{ github.workspace }}/nomount-dist" ]; then
            echo "[+] Adding NoMount Metamodule..."
            cp -f "${{ github.workspace }}/nomount-dist/"*.zip "$BUNDLE_DIR/" 2>/dev/null || true
          fi

          # 5. Add Summary Markdown
          if [ -f "/tmp/build-summary-${{ env.SUMMARY_BASE }}.md" ]; then
            cp -f "/tmp/build-summary-${{ env.SUMMARY_BASE }}.md" "$BUNDLE_DIR/"
          fi

          # Create the All-In-One Flavor Package ZIP
          PKG_NAME="${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle.zip"
          (cd "$BUNDLE_DIR" && zip -r9 "${{ github.workspace }}/$PKG_NAME" .)

          echo "[✓] Successfully created Flavor Bundle: $PKG_NAME"
          ls -la "$BUNDLE_DIR"

      - name: Upload Flavor Release Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle
          path: ${{ steps.extract.outputs.file_name }}-${{ matrix.flavor }}-Bundle.zip
          if-no-files-found: error
          compression-level: 0

      - name: Promote Verified Pins (Update Mode)
        if: ${{ success() && inputs.commit_mode == 'update' }}
        shell: bash
        env:
          NOMOUNT_SHA: ${{ needs.resolve-sources.outputs.nomount_commit }}
          SUSFS_SHA: ${{ needs.resolve-sources.outputs.susfs_commit }}
          KERNELSU_NEXT_SHA: ${{ needs.resolve-sources.outputs.ksun_commit }}
          SUKISU_ULTRA_SHA: ${{ needs.resolve-sources.outputs.ultra_commit }}
          RESUKISU_SHA: ${{ needs.resolve-sources.outputs.resukisu_commit }}
          APPROVE_NOMOUNT: ${{ inputs.use_nomount }}
          APPROVE_SUSFS: 'true'
          APPROVE_KERNELSU_NEXT: ${{ matrix.flavor == 'KernelSU-Next' || inputs.root_flavor == 'All' }}
          APPROVE_SUKISU_ULTRA: ${{ matrix.flavor == 'SukiSU-Ultra' || inputs.root_flavor == 'All' }}
          APPROVE_RESUKISU: ${{ matrix.flavor == 'ReSukiSU' || inputs.root_flavor == 'All' }}
        run: |
          set -euo pipefail
          echo "Promoting verified pins on successful build..."
          python3 .github/scripts/update_verified_pins.py
          if ! git diff --quiet .github/config/commits.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/config/commits.json .github/pins/history/
            git commit -m "chore(pins): promote verified dependency pins [skip ci]"
            git push origin HEAD:${{ github.ref }} || true
          fi

  release:
    name: "Create Release"
    needs: [build-kernel, resolve-sources]
    if: ${{ inputs.release_type != 'Action' && needs.build-kernel.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/
          find release-artifacts/ -name "*.zip" -exec cp -f {} dist/ \;
          find release-artifacts/ -name "*.apk" -exec cp -f {} dist/ \;
          find release-artifacts/ -name "*.md" -exec cp -f {} dist/ \;
          echo "Release assets prepared:"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v6.12.30-android16-${{ github.run_number }}"
          name: "Kernel 6.12.30-android16 - ${{ inputs.root_flavor }}"
          draft: ${{ inputs.release_type == 'Draft' }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: dist/*
          body: |
            ## ⚡ Android 16 GKI Kernel (`6.12.30`)

            ### 📲 Flashing Instructions
            1. Download the all-in-one **`*-Bundle.zip`** for your chosen root flavor and extract it.
            2. Flash **`*-AnyKernel3.zip`** using the **[Kernel Flasher](https://github.com/fatalcoder524/KernelFlasher/releases)** app. *(Vendor module bypass is built-in)*
            3. Install the included **Root Manager APK** (`*.apk`).
            4. Reboot your device.
            5. Flash **[susfs4ksu-module (by sidex15)](https://github.com/sidex15/susfs4ksu-module/releases)** in your Root Manager for kernel-level root hiding.
            6. *(Optional)* Flash **`Nethunter-Wireless-Modules.zip`** or **`NoMount-*.zip`** inside the Manager.
