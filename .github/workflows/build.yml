name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      kernel_build_version:
        description: "Kernel Version"
        type: choice
        options:
          - android16-6.12
        default: android16-6.12
      os_patch_level:
        description: "OS Patch Level (e.g. 2025-07, or 'all')"
        type: string
        required: false
        default: "2025-07"
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - FULL
          - KSUN+SUSFS+NOMOUNT
          - KSUN+SUSFS+BBG+NET+DS
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+DS
          - KSUN+SUSFS
          - KSUN+BBG
          - KSUN+NET
          - KSUN+DS
          - KSUN
          - NOMOUNT
          - NONE
        default: FULL
      ksu_branch:
        description: "KernelSU branch or commit (empty = latest dev-susfs branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android16-6-12:
        description: "SUSFS commit for android16-6.12 (empty = latest branch tip)"
        type: string
        required: false
        default: ""

jobs:
  resolve-nomount:
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
    steps:
      - name: Resolve latest NoMount dev commit
        id: resolve
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1}')"
          if [ -z "$sha" ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to resolve NoMount dev branch tip." >&2
            exit 1
          fi
          echo "nomount_commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved NoMount dev commit: $sha"

  build-nomount-module:
    needs: resolve-nomount
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}

      - name: Build NoMount metamodule
        id: nomount-metamodule
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}

      - name: Upload NoMount metamodule
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.nomount-metamodule.outputs.module_path }}
          if-no-files-found: error
          compression-level: 0

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Config and Build Final Matrix
        id: final
        shell: bash
        run: |
          CONFIG_FILE=".github/config/${{ inputs.kernel_build_version }}.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file not found: $CONFIG_FILE"
            exit 1
          fi

          CONFIG_JSON=$(cat "$CONFIG_FILE" | jq -c .)

          FINAL=$(jq -cn \
            --argjson cfg "$CONFIG_JSON" \
            '
            ($cfg.version | split("-")) as $version_parts
            | ($cfg.include) as $targets
            | {
              include: (
                [
                  $targets[] as $item
                  | {
                      version: $cfg.version,
                      android_version: $version_parts[0],
                      kernel_version: $version_parts[1],
                      sublevel: $item.sublevel,
                      os_patch_level: $item.date,
                      variant: "Normal"
                    }
                ]
                + [
                    $targets[] as $item
                    | select($item.variant != null)
                    | {
                        version: $cfg.version,
                        android_version: $version_parts[0],
                        kernel_version: $version_parts[1],
                        sublevel: $item.sublevel,
                        os_patch_level: $item.date,
                        variant: $item.variant
                      }
                  ]
                | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])
              )
            }')

          SELECTED_PATCH_LEVEL="${{ inputs.os_patch_level }}"
          if [ "$SELECTED_PATCH_LEVEL" = "all" ] || [ -z "$SELECTED_PATCH_LEVEL" ]; then
            SELECTED_PATCH_LEVEL=""
          fi
          if [ -n "$SELECTED_PATCH_LEVEL" ]; then
            FULL_FINAL="$FINAL"
            FINAL=$(jq -c --arg patch_level "$SELECTED_PATCH_LEVEL" '
              {include: [.include[] | select(.os_patch_level == $patch_level)]}
            ' <<< "$FINAL")
            if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
              FINAL=$(jq -c --arg sublevel "$SELECTED_PATCH_LEVEL" '
                {include: [.include[] | select(.sublevel == $sublevel)]}
              ' <<< "$FULL_FINAL")
            fi
          fi
          if [ "$(jq '.include | length' <<< "$FINAL")" -eq 0 ]; then
            echo "Error: no build targets match patch level '${SELECTED_PATCH_LEVEL}'." >&2
            exit 1
          fi

          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"

  build-kernel:
    name: "${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }} (${{ matrix.variant }})"
    needs: [generate-matrix, resolve-nomount]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup more Swap (for LTO)
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ matrix.version }}
          sublevel: ${{ matrix.sublevel }}
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ matrix.version }}
          android_version: ${{ matrix.android_version }}
          kernel_version: ${{ matrix.kernel_version }}
          os_patch_level: ${{ matrix.os_patch_level }}

      - name: Build FUSE-BPF Userspace Daemon
        if: ${{ matrix.version == 'android16-6.12' }}
        continue-on-error: true
        uses: ./.github/actions/fuse-bpf
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}
          android_version: ${{ matrix.android_version }}

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          OS_PATCH_LEVEL_INPUT="${{ matrix.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ matrix.android_version }}
          kernel_version: ${{ matrix.kernel_version }}
          sublevel: ${{ matrix.sublevel }}
          os_patch_level: ${{ matrix.os_patch_level }}
          variant: ${{ matrix.variant }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ matrix.version }}
          android_version: ${{ matrix.android_version }}
          kernel_version: ${{ matrix.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ matrix.os_patch_level }}

      - name: Setup KernelSU-Next
        if: ${{ contains(inputs.feature_set, 'KSUN') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/kernelsu
        with:
          ksu_branch: ${{ inputs.ksu_branch }}

      - name: SUSFS
        if: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ inputs.susfs_commit_android16-6-12 }}
          version: ${{ matrix.version }}
          android_version: ${{ matrix.android_version }}
          kernel_version: ${{ matrix.kernel_version }}
          os_patch_level: ${{ matrix.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Baseband Guard
        if: ${{ contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: ${{ contains(inputs.feature_set, 'NET') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/networking
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}
          android_version: ${{ matrix.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: ${{ contains(inputs.feature_set, 'DS') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}

      - name: Apply NTSync Patches
        uses: ./.github/actions/ntsync
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ matrix.kernel_version }}

      - name: Apply Unicode Fix Patch
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ matrix.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc

      - name: Enable BTF
        uses: ./.github/actions/btf
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ matrix.version }}
          kernel_version: ${{ matrix.kernel_version }}

      - name: Integrate NoMount
        if: ${{ contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}
        uses: ./.github/actions/nomount
        with:
          commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}
          kernel_version: ${{ matrix.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ matrix.variant }}
          kernel_version: ${{ matrix.kernel_version }}
          android_version: ${{ matrix.android_version }}
          version: ${{ matrix.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: ${{ always() }}
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: 'Setup Cache and Build Environment'
        uses: ./.github/actions/cache-setup
        with:
          version: ${{ matrix.version }}
          android_version: ${{ matrix.android_version }}
          kernel_version: ${{ matrix.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/gki.fragment"

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ matrix.version }}
          bypass: false

      - name: Build Bypass Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        uses: ./.github/actions/build-kernel
        with:
          bypass: true
          version: ${{ matrix.version }}

      - name: 📋 Consolidated Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_BASE="${{ steps.extract.outputs.file_name }}"
          if [ -z "${SUMMARY_BASE}" ]; then
            SUMMARY_BASE="${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
            VARIANT="${{ matrix.variant }}"
            if [ -n "${VARIANT}" ] && [ "${VARIANT}" != "Normal" ]; then
              SUMMARY_BASE="${SUMMARY_BASE}-${VARIANT}"
            fi
          fi
          SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
          echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          KERNEL_VER_STR=""
          if [ -f "${{ github.workspace }}/AnyKernel3/Image" ]; then
            KERNEL_VER_STR=$(strings "${{ github.workspace }}/AnyKernel3/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
          fi

          KSU_VER="${KSU_VERSION:-N/A}"
          KSU_TAG="${KSU_GIT_TAG:-N/A}"
          ROOT_IMPL="KernelSU-Next"
          ROOT_MANAGER="KernelSU-Next Manager"
          ROOT_VERSION="${KSU_TAG}"
          ROOT_SHA="${KSU_COMMIT:-N/A}"
          NOMOUNT_SHA="${NOMOUNT_COMMIT:-N/A}"
          SUSFS_SHA="${SUSFS_COMMIT:-N/A}"

          SUSFS_VER="N/A"
          if [ -f "${{ github.workspace }}/kernel/common/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep '#define SUSFS_VERSION' "${{ github.workspace }}/kernel/common/include/linux/susfs.h" | awk -F'"' '{print $2}' || echo "N/A")
          fi

          {
            echo "## ${{ matrix.android_version }} ${{ matrix.kernel_version }}.${{ matrix.sublevel }} (${{ matrix.variant }}) — ${STATUS}"
            echo
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Status** | ${STATUS} |"
            echo "| **Kernel** | ${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }} |"
            if [ -n "$KERNEL_VER_STR" ]; then
              echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
            fi
            echo "| **KSU Version** | ${KSU_VER} |"
            echo "| **KSU Tag** | ${KSU_TAG} |"
            echo "| **Root Implementation** | ${ROOT_IMPL} |"
            echo "| **Root Manager** | ${ROOT_MANAGER} |"
            echo "| **Root Version** | ${ROOT_VERSION} |"
            echo "| **Root Commit** | ${ROOT_SHA} |"
            echo "| **SUSFS Version** | ${SUSFS_VER} |"
            echo "| **SUSFS Commit** | ${SUSFS_SHA} |"
            echo "| **NoMount Commit** | ${NOMOUNT_SHA} |"
            echo "| **Feature Set** | ${{ inputs.feature_set }} |"
            echo "| **Variant** | ${{ matrix.variant }} |"
            echo

            if [ -f /tmp/kernel-fixes-summary.md ]; then
              echo "### 🔧 Kernel Fixes"
              cat /tmp/kernel-fixes-summary.md
              echo
            fi
          } > "$SUMMARY_FILE"

      - name: Upload Build Summary Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_BASE }}-Summary
          path: /tmp/build-summary-${{ env.SUMMARY_BASE }}.md
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

  summary:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build-kernel]
    steps:
      - name: 📥 Download Build Summaries
        uses: actions/download-artifact@v7
        with:
          path: ./summaries
          pattern: "*-Summary"
          merge-multiple: true

      - name: 📋 Merge Summaries
        run: |
          {
            echo "# 📋 Consolidated Build Summary"
            echo ""
            for summary_file in ./summaries/*.md; do
              if [ -f "$summary_file" ]; then
                cat "$summary_file"
                echo ""
                echo "---"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Cleanup Summary Files
        if: ${{ always() }}
        run: rm -rf ./summaries

      - name: 🧹 Delete Summary Artifacts
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.run_id }}"
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | endswith("-Summary")) | .id')
          for id in $ARTIFACTS; do
            echo "Deleting summary artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') }}
    permissions:
      contents: write
    needs:
      - build-kernel
      - build-nomount-module

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: .github/config/RELEASE_NOTES.md
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate New Tag
        id: tag
        if: inputs.release_type != 'Action'
        run: |
          mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)

          LATEST_REV=0
          for TAG in "${RELEASE_TAGS[@]}"; do
            REV="${TAG#r}"
            if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
              LATEST_REV="$REV"
            fi
          done

          if [[ "$LATEST_REV" -gt 0 ]]; then
            NEW_TAG="r$((LATEST_REV + 1))"
          else
            NEW_TAG="r1"
          fi

          if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
            echo "Latest r-tag: r${LATEST_REV}"
          else
            echo "No existing r-tags found; starting at r1"
          fi
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Set Release Title
        id: release_meta
        run: |
          set -euo pipefail

          if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
            REV_NUM="${BASH_REMATCH[1]}"
            release_title="Release ${REV_NUM}"
          else
            release_title="Release ${NEW_TAG}"
          fi

          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

      - name: Extract KernelSU Version Info
        id: ksu_version
        run: |
          set -euo pipefail

          KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
          KSU_INPUT="${{ inputs.ksu_branch }}"
          if [ -z "$KSU_INPUT" ]; then
            KSU_INPUT="dev-susfs"
          fi

          if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
            echo "Cloning KernelSU-Next from branch: $KSU_INPUT"
            git clone --branch "$KSU_INPUT" "$KSU_REPO" /tmp/kernelsu-next
            cd /tmp/kernelsu-next
            KSUN_COMMIT=$(git rev-parse HEAD)
          else
            echo "Cloning KernelSU-Next from dev-susfs branch, then checking out commit: $KSU_INPUT"
            git clone --branch dev-susfs "$KSU_REPO" /tmp/kernelsu-next
            cd /tmp/kernelsu-next
            git fetch --depth=50 origin "$KSU_INPUT"
            git checkout "$KSU_INPUT"
            KSUN_COMMIT="$KSU_INPUT"
          fi

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          OFFICIAL_KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
          retry git fetch "$OFFICIAL_KSU_REPO" dev
          STOCK_COMMIT=$(git merge-base HEAD FETCH_HEAD)
          echo "KSU Stock Commit (official sync point): $STOCK_COMMIT"

          COMMITS_COUNT=$(git rev-list --count "$STOCK_COMMIT")
          BASE_VERSION=30000
          KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)

          KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$STOCK_COMMIT" 2>/dev/null || echo "no-tag")

          MANAGER_RUN_ID=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?head_sha=${STOCK_COMMIT}" | jq -r '.workflow_runs[0].id // empty')
          if [[ -n "${MANAGER_RUN_ID:-}" ]]; then
            KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/runs/${MANAGER_RUN_ID}"
          else
            KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml"
          fi

          echo "Commits count: $COMMITS_COUNT"
          echo "KSU Version: $KSU_VERSION"
          echo "KSU Git Tag: $KSU_GIT_TAG"
          echo "KSU Manager: $KSU_MANAGER"

          echo "KSUN_BRANCH=$KSU_INPUT" >> $GITHUB_ENV
          echo "KSUN_COMMIT=$KSUN_COMMIT" >> $GITHUB_ENV
          echo "KSU_COMMITS_COUNT=$COMMITS_COUNT" >> $GITHUB_ENV
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
          echo "KSU_MANAGER=$KSU_MANAGER" >> $GITHUB_ENV

      - name: Set release body
        run: |
          set -e

          RELEASE_NOTES_PATH="$RELEASE_NOTES"
          : > release_body.md

          python3 .github/scripts/render_release_body.py "$RELEASE_NOTES_PATH" > release_body.md

      - name: Publish release notes preview
        run: |
          {
            echo "## Release Notes Preview"
            echo
            cat release_body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download AnyKernel3 Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*-AnyKernel3'
          merge-multiple: false

      - name: Download NoMount metamodule
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*NoMount-Metamodule'
          merge-multiple: false
          if-no-files-found: ignore

      - name: Zip AnyKernel3 for Release
        run: |
          set -e
          shopt -s nullglob

          for dir in release-assets/*-AnyKernel3; do
            zip_name="${dir}.zip"
            rm -f "$zip_name"
            cd "$dir"
            zip -r -q -9 "../$(basename "$zip_name")" .
            cd - >/dev/null
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: |
            release-assets/*.zip
            release-assets/**/*.zip
            release-assets/*-boot*.img
            release-assets/**/*-boot*.img
